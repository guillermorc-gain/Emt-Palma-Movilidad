name: Build APK

on:
  push:
    branches: [main, claude/pwa-install-support-dXc0v]
    # Solo lo que acaba dentro de ESTE APK. Antes se usaba paths-ignore y un
    # cambio en gestión compilaba también esta app: salía una versión nueva sin
    # que la app hubiera cambiado en nada y pedía actualizar a todo el mundo.
    # Los ficheros de datos (resúmenes, cuadrante, listas) no están aquí a
    # propósito: los escriben las propias apps y lanzaban builds en bucle.
    paths:
      - 'index.html'
      - 'app.js'
      - 'service-worker.js'
      - 'manifest.json'
      - 'icons/**'
      - 'fonts/**'
      - 'scripts/build-www.js'
      - 'capacitor.config.json'
      - '.github/workflows/build-apk.yml'
      # Comunes a las dos apps
      - 'package.json'
      - 'package-lock.json'
      - '.github/debug.keystore.b64'
      - '.github/google-services.json'
  workflow_dispatch:
jobs:
  build-apk:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Inject build version
        run: echo "const APP_VERSION = 'build-${{ github.run_number }}';" > version.js

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build www/
        run: npm run build:www

      - name: Add Android platform
        run: npx cap add android

      - name: Patch variables.gradle — targetSdkVersion 34
        run: |
          VARS="android/variables.gradle"
          sed -i 's/compileSdkVersion = [0-9]*/compileSdkVersion = 34/' "$VARS"
          sed -i 's/targetSdkVersion = [0-9]*/targetSdkVersion = 34/' "$VARS"

      - name: Patch build.gradle — versionCode/versionName from build number
        run: |
          GRADLE="android/app/build.gradle"
          N=${{ github.run_number }}
          MAJOR=$((N / 100)); MINOR=$((N % 100))
          sed -i "s/versionCode [0-9]*/versionCode $N/" "$GRADLE"
          VER="$MAJOR.$(printf '%02d' $MINOR)"
          sed -i "s/versionName \"[^\"]*\"/versionName \"$VER\"/" "$GRADLE"
          grep -E "versionCode|versionName" "$GRADLE"
          echo "APP_VER=$VER" >> $GITHUB_ENV

      - name: Patch AndroidManifest — permissions + intent filter localhost
        run: |
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          sed -i 's|<uses-permission android:name="android.permission.INTERNET" />|<uses-permission android:name="android.permission.INTERNET" />\n    <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" />\n    <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />\n    <uses-permission android:name="android.permission.ACCESS_BACKGROUND_LOCATION" />\n    <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />\n    <uses-permission android:name="android.permission.FOREGROUND_SERVICE_LOCATION" />\n    <uses-permission android:name="android.permission.FOREGROUND_SERVICE_DATA_SYNC" />\n    <uses-permission android:name="android.permission.RECEIVE_BOOT_COMPLETED" />\n    <uses-permission android:name="android.permission.POST_NOTIFICATIONS"/>|' "$MANIFEST"
          sed -i 's|</activity>|        <intent-filter>\n            <action android:name="android.intent.action.VIEW" />\n            <category android:name="android.intent.category.DEFAULT" />\n            <category android:name="android.intent.category.BROWSABLE" />\n            <data android:scheme="https" android:host="localhost" />\n        </intent-filter>\n    </activity>|' "$MANIFEST"
          sed -i 's|<uses-permission android:name="android.permission.RECEIVE_BOOT_COMPLETED" />|<uses-permission android:name="android.permission.RECEIVE_BOOT_COMPLETED" />\n    <uses-permission android:name="android.permission.REQUEST_INSTALL_PACKAGES" />\n    <uses-permission android:name="android.permission.REQUEST_IGNORE_BATTERY_OPTIMIZATIONS" />|' "$MANIFEST"
          sed -i 's|</application>|    <receiver android:name=".MainActivity$GeofenceReceiver" android:exported="false" />\n    <receiver android:name=".MainActivity$ChatReceiver" android:exported="false" />\n    <receiver android:name=".MainActivity$LeidoReceiver" android:exported="false" />\n    <receiver android:name=".MainActivity$ResponderReceiver" android:exported="false" />\n    <service android:name=".MainActivity$ChatJob" android:permission="android.permission.BIND_JOB_SERVICE" android:exported="false" />\n    <service android:name=".MainActivity$AvisoService" android:foregroundServiceType="dataSync" android:exported="false" />\n    <receiver android:name=".MainActivity$BootReceiver" android:exported="false"><intent-filter><action android:name="android.intent.action.BOOT_COMPLETED"/></intent-filter></receiver>\n    <receiver android:name=".MainActivity$RegistrarReceiver" android:exported="false"><intent-filter><action android:name="com.guillermorc.horasemt.REGISTRAR"/></intent-filter></receiver>\n    <provider android:name="androidx.core.content.FileProvider" android:authorities="${applicationId}.fileprovider" android:exported="false" android:grantUriPermissions="true"><meta-data android:name="android.support.FILE_PROVIDER_PATHS" android:resource="@xml/file_paths"/></provider>\n    </application>|' "$MANIFEST"
          # Los avisos al instante de Firebase (ver PushService)
          sed -i 's|</application>|    <service android:name=".MainActivity$PushService" android:exported="false"><intent-filter><action android:name="com.google.firebase.MESSAGING_EVENT"/></intent-filter></service>\n    </application>|' "$MANIFEST"

      - name: Create FileProvider paths config
        run: |
          mkdir -p android/app/src/main/res/xml
          cat > android/app/src/main/res/xml/file_paths.xml << 'XMLEOF'
          <?xml version="1.0" encoding="utf-8"?>
          <paths>
              <cache-path name="apk_downloads" path="." />
          </paths>
          XMLEOF

      - name: Create chat notification icon
        run: |
          mkdir -p android/app/src/main/res/drawable
          cat > android/app/src/main/res/drawable/ic_stat_chat.xml << 'XMLEOF'
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="24dp" android:height="24dp"
              android:viewportWidth="24" android:viewportHeight="24">
              <path
                  android:fillColor="#FFFFFFFF"
                  android:pathData="M20,2H4C2.9,2 2,2.9 2,4v18l4,-4h14c1.1,0 2,-0.9 2,-2V4C22,2.9 21.1,2 20,2z"/>
          </vector>
          XMLEOF

      - name: Patch MainActivity — OAuth + file downloads + BroadcastReceiver
        run: |
          cat > android/app/src/main/java/com/guillermorc/horasemt/MainActivity.java << 'JAVAEOF'
          package com.guillermorc.horasemt;

          import android.app.NotificationChannel;
          import android.app.NotificationManager;
          import android.app.PendingIntent;
          import android.content.BroadcastReceiver;
          import android.content.ContentValues;
          import android.content.Context;
          import android.content.Intent;
          import android.content.SharedPreferences;
          import android.net.Uri;
          import android.os.Build;
          import android.os.Bundle;
          import android.os.Environment;
          import android.os.Handler;
          import android.os.Looper;
          import android.provider.MediaStore;
          import android.webkit.JavascriptInterface;
          import android.widget.Toast;
          import androidx.core.app.ActivityCompat;
          import androidx.core.app.NotificationCompat;
          import androidx.core.content.FileProvider;
          import com.getcapacitor.BridgeActivity;
          import com.google.android.gms.location.Geofence;
          import com.google.android.gms.location.GeofencingClient;
          import com.google.android.gms.location.GeofencingEvent;
          import com.google.android.gms.location.GeofencingRequest;
          import com.google.android.gms.location.LocationServices;
          import java.io.OutputStream;
          import java.util.ArrayList;
          import java.util.List;

          public class MainActivity extends BridgeActivity {

              public static final String PREFS      = "HorasEMT";
              public static final String CHANNEL_ID = "trabajo_cercano";

              // Con la app delante, el aviso al instante no pone nada en la barra:
              // solo le dice a la app que mire ya, y ella suena como siempre.
              static volatile MainActivity delante;

              @Override
              public void onResume() { super.onResume(); delante = this; }

              @Override
              public void onPause() { delante = null; super.onPause(); }

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  createNotificationChannel();
                  requestNotificationPermission();
                  requestLocationPermissions();
                  handleOAuthIntent(getIntent());
                  anotarAbrirNotas(getIntent());
                  setupJavascriptInterface();
              }

              // El aviso del chat trae este extra; se deja apuntado para que la
              // app, al arrancar, sepa que tiene que abrirse en las notas.
              private void anotarAbrirNotas(Intent intent) {
                  if (intent != null && intent.getBooleanExtra("abrirNotas", false)) {
                      getSharedPreferences(PREFS, Context.MODE_PRIVATE)
                          .edit().putString("abrirNotas", "1").apply();
                  }
                  if (intent != null && intent.getBooleanExtra("abrirCuadrante", false)) {
                      getSharedPreferences(PREFS, Context.MODE_PRIVATE)
                          .edit().putString("abrirCuadrante", "1").apply();
                  }
              }

              private void requestNotificationPermission() {
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.TIRAMISU) {
                      if (ActivityCompat.checkSelfPermission(this, android.Manifest.permission.POST_NOTIFICATIONS)
                              != android.content.pm.PackageManager.PERMISSION_GRANTED) {
                          ActivityCompat.requestPermissions(this,
                              new String[]{ android.Manifest.permission.POST_NOTIFICATIONS }, 1);
                      }
                  }
              }

              private void requestLocationPermissions() {
                  List<String> perms = new ArrayList<>();
                  if (ActivityCompat.checkSelfPermission(this, android.Manifest.permission.ACCESS_FINE_LOCATION)
                          != android.content.pm.PackageManager.PERMISSION_GRANTED) {
                      perms.add(android.Manifest.permission.ACCESS_FINE_LOCATION);
                      perms.add(android.Manifest.permission.ACCESS_COARSE_LOCATION);
                  }
                  if (!perms.isEmpty()) {
                      ActivityCompat.requestPermissions(this, perms.toArray(new String[0]), 2);
                  } else if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.Q) {
                      if (ActivityCompat.checkSelfPermission(this, android.Manifest.permission.ACCESS_BACKGROUND_LOCATION)
                              != android.content.pm.PackageManager.PERMISSION_GRANTED) {
                          ActivityCompat.requestPermissions(this,
                              new String[]{ android.Manifest.permission.ACCESS_BACKGROUND_LOCATION }, 3);
                      }
                  }
              }

              @Override
              public void onRequestPermissionsResult(int requestCode, String[] permissions, int[] grantResults) {
                  super.onRequestPermissionsResult(requestCode, permissions, grantResults);
                  if (requestCode == 2 && grantResults.length > 0
                          && grantResults[0] == android.content.pm.PackageManager.PERMISSION_GRANTED) {
                      if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.Q) {
                          if (ActivityCompat.checkSelfPermission(this, android.Manifest.permission.ACCESS_BACKGROUND_LOCATION)
                                  != android.content.pm.PackageManager.PERMISSION_GRANTED) {
                              new Handler(Looper.getMainLooper()).postDelayed(() -> {
                                  ActivityCompat.requestPermissions(this,
                                      new String[]{ android.Manifest.permission.ACCESS_BACKGROUND_LOCATION }, 3);
                              }, 500);
                          }
                      }
                  }
              }

              @Override
              protected void onNewIntent(Intent intent) {
                  super.onNewIntent(intent);
                  anotarAbrirNotas(intent);
                  setIntent(intent);
                  handleOAuthIntent(intent);
              }

              private void createNotificationChannel() {
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                      NotificationChannel ch = new NotificationChannel(
                          CHANNEL_ID, "Trabajo cercano", NotificationManager.IMPORTANCE_HIGH);
                      ((NotificationManager) getSystemService(Context.NOTIFICATION_SERVICE))
                          .createNotificationChannel(ch);
                  }
              }

              private void handleOAuthIntent(Intent intent) {
                  if (intent == null || getBridge() == null) return;
                  Uri data = intent.getData();
                  if (data == null) return;
                  // El enlace del correo de «acceso concedido»: la app entra
                  // sola con la cuenta que esperaba la autorización
                  if (data.getQueryParameter("autorizado") != null) {
                      String em = data.getQueryParameter("email");
                      String au = "https://localhost/?autorizado=1" + (em != null && !em.isEmpty() ? "&email=" + Uri.encode(em) : "");
                      getBridge().getWebView().post(() -> getBridge().getWebView().loadUrl(au));
                      return;
                  }
                  String code = data.getQueryParameter("code");
                  if (code != null && !code.isEmpty()) {
                      String url = "https://localhost/?code=" + Uri.encode(code);
                      getBridge().getWebView().post(() -> getBridge().getWebView().loadUrl(url));
                      return;
                  }
                  String token = data.getQueryParameter("access_token");
                  if (token == null || token.isEmpty()) return;
                  String exp = data.getQueryParameter("expires_in");
                  String url = "https://localhost/?access_token=" + Uri.encode(token)
                      + (exp != null ? "&expires_in=" + exp : "");
                  getBridge().getWebView().post(() -> getBridge().getWebView().loadUrl(url));
              }

              private void setupJavascriptInterface() {
                  if (getBridge() == null || getBridge().getWebView() == null) return;
                  final Context ctx = this;
                  getBridge().getWebView().addJavascriptInterface(new Object() {

                      @JavascriptInterface
                      public boolean hasBackgroundLocationPermission() {
                          if (Build.VERSION.SDK_INT < Build.VERSION_CODES.Q) return true;
                          return ActivityCompat.checkSelfPermission(ctx, android.Manifest.permission.ACCESS_BACKGROUND_LOCATION)
                              == android.content.pm.PackageManager.PERMISSION_GRANTED;
                      }

                      @JavascriptInterface
                      public void requestLocationPermissions() {
                          ((MainActivity) ctx).requestLocationPermissions();
                      }

                      @JavascriptInterface
                      public void activarAvisoChat(String email, boolean esGestor, String url) {
                          ctx.getSharedPreferences(PREFS, Context.MODE_PRIVATE).edit()
                              .putString("chatEmail", email == null ? "" : email)
                              .putBoolean("chatEsGestor", esGestor)
                              .putString("chatUrl", url == null ? "" : url)
                              .apply();
                          programarAvisoChat(ctx);
                          asegurarAvisoDeFondo(ctx);
                          arrancarVigilante(ctx);
                      }

                      // Opciones → Notificaciones: el turno en la barra, sí o no
                      @JavascriptInterface
                      public void ponerAvisoTurno(boolean activo) {
                          ctx.getSharedPreferences(PREFS, Context.MODE_PRIVATE).edit()
                              .putString("avisoTurno", activo ? "1" : "0").apply();
                          arrancarVigilante(ctx);
                      }

                      // El token de los avisos al instante, para apuntarlo en el
                      // servidor. La primera vez aún no está: se pide a Firebase y
                      // la app vuelve a preguntar al rato.
                      @JavascriptInterface
                      public String pushToken() {
                          String t = ctx.getSharedPreferences(PREFS, Context.MODE_PRIVATE).getString("pushToken", "");
                          if (t.isEmpty()) {
                              try {
                                  com.google.firebase.messaging.FirebaseMessaging.getInstance().getToken()
                                      .addOnSuccessListener(nuevo -> ctx.getSharedPreferences(PREFS, Context.MODE_PRIVATE)
                                          .edit().putString("pushToken", nuevo == null ? "" : nuevo).apply());
                              } catch (Exception ignored) {}
                          }
                          return t;
                      }

                      // Quita de la barra un aviso que ya está en la app
                      @JavascriptInterface
                      public void quitarAviso(int id) {
                          NotificationManager nm = (NotificationManager)
                              ctx.getSystemService(Context.NOTIFICATION_SERVICE);
                          if (nm != null) nm.cancel(id);
                      }

                      @JavascriptInterface
                      public void chatLeidoHasta(String cuando) {
                          ctx.getSharedPreferences(PREFS, Context.MODE_PRIVATE).edit()
                              .putString("chatVisto", cuando == null ? "" : cuando).apply();
                          NotificationManager nm = (NotificationManager)
                              ctx.getSystemService(Context.NOTIFICATION_SERVICE);
                          if (nm != null) nm.cancel(1002);
                      }

                      // Cuándo miró por última vez con la app cerrada. Es lo que
                      // distingue "no hay avisos" de "esto lleva parado desde el martes".
                      @JavascriptInterface
                      public String ultimoAvisoFondo() {
                          return String.valueOf(ctx.getSharedPreferences(PREFS, Context.MODE_PRIVATE)
                              .getLong("avisoFondoUltimo", 0L));
                      }

                      @JavascriptInterface
                      public void saveToPrefs(String key, String value) {
                          ctx.getSharedPreferences(PREFS, Context.MODE_PRIVATE)
                              .edit().putString(key, value).apply();
                      }

                      @JavascriptInterface
                      public void scheduleWorkNotification(String horaInicio, String horaFin) {
                          SharedPreferences prefs = ctx.getSharedPreferences(PREFS, Context.MODE_PRIVATE);
                          String today = new java.text.SimpleDateFormat("yyyyMMdd", java.util.Locale.US).format(new java.util.Date());
                          // Con el día entero registrado no se avisa de nada más,
                          // esté como esté el modo de aviso.
                          if (today.equals(prefs.getString("jornadaCompleta", ""))) return;
                          // Con "cada lugar" la decisión ya la ha tomado la app,
                          // que es la que sabe en cuál está; aquí solo se
                          // comprueba el caso simple de una vez al día.
                          if ("una".equals(prefs.getString("avisoLugar", "cada"))
                              && today.equals(prefs.getString("lastRegisteredDate", ""))) return;
                          prefs.edit()
                              .putString("lastHoraInicio", horaInicio)
                              .putString("lastHoraFin", horaFin).apply();
                          NotificationManager nm = (NotificationManager) ctx.getSystemService(Context.NOTIFICATION_SERVICE);
                          if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                              nm.createNotificationChannel(new NotificationChannel(
                                  CHANNEL_ID, "Trabajo cercano", NotificationManager.IMPORTANCE_HIGH));
                          }
                          int flags = PendingIntent.FLAG_UPDATE_CURRENT
                              | (Build.VERSION.SDK_INT >= Build.VERSION_CODES.M ? PendingIntent.FLAG_IMMUTABLE : 0);
                          Intent bi = new Intent("com.guillermorc.horasemt.REGISTRAR");
                          bi.setPackage("com.guillermorc.horasemt");
                          PendingIntent broadcastPI = PendingIntent.getBroadcast(ctx, 0, bi, flags);
                          Intent oi = new Intent(ctx, MainActivity.class);
                          oi.addFlags(Intent.FLAG_ACTIVITY_SINGLE_TOP);
                          PendingIntent openPI = PendingIntent.getActivity(ctx, 1, oi, flags);
                          nm.notify(1001, new NotificationCompat.Builder(ctx, CHANNEL_ID)
                              .setSmallIcon(android.R.drawable.ic_menu_mylocation)
                              .setContentTitle("📍 EMT - Movilidad")
                              .setContentText("Parece que estás en el trabajo. ¿Registras la jornada?")
                              .setPriority(NotificationCompat.PRIORITY_HIGH)
                              .setContentIntent(openPI)
                              .setAutoCancel(false)
                              .addAction(0, "✅ Registrar jornada", broadcastPI)
                              .addAction(0, "🕐 Otro horario", openPI)
                              .build());
                      }

                      @JavascriptInterface
                      public void cancelWorkNotification() {
                          NotificationManager nm = (NotificationManager) ctx.getSystemService(Context.NOTIFICATION_SERVICE);
                          nm.cancel(1001);
                          // Y el de "registra tu jornada", que ya está registrada
                          nm.cancel(1003);
                          // y el turno de la barra, si la de hoy ya está
                          arrancarVigilante(ctx);
                      }

                      @JavascriptInterface
                      public void saveFile(String content, String filename) {
                          byte[] bytes;
                          try { bytes = content.getBytes("UTF-8"); }
                          catch (Exception e) { bytes = content.getBytes(); }
                          guardarEnDescargas(bytes, filename);
                      }

                      // Un .xlsx es binario y no sobrevive a un String, así que
                      // viaja en base64 y se decodifica aquí.
                      @JavascriptInterface
                      public void saveFileBase64(String base64, String filename) {
                          try {
                              guardarEnDescargas(
                                  android.util.Base64.decode(base64, android.util.Base64.DEFAULT),
                                  filename);
                          } catch (Exception e) {
                              new Handler(Looper.getMainLooper()).post(() ->
                                  Toast.makeText(ctx, "Error al guardar", Toast.LENGTH_SHORT).show());
                          }
                      }

                      private void guardarEnDescargas(byte[] data, String filename) {
                          final String fname = (filename != null && !filename.isEmpty())
                              ? filename : "horas-emt.json";
                          try {
                              if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.Q) {
                                  ContentValues v = new ContentValues();
                                  v.put(MediaStore.Downloads.DISPLAY_NAME, fname);
                                  // El tipo debe seguir a la extensión: un CSV guardado
                                  // como JSON no lo abre la hoja de cálculo
                                  v.put(MediaStore.Downloads.MIME_TYPE,
                                      fname.endsWith(".csv") ? "text/csv"
                                      : fname.endsWith(".xlsx")
                                        ? "application/vnd.openxmlformats-officedocument.spreadsheetml.sheet"
                                      : fname.endsWith(".xls") ? "application/vnd.ms-excel"
                                      : fname.endsWith(".pdf") ? "application/pdf"
                                      : fname.endsWith(".json") ? "application/json"
                                      // Lo que no se reconozca se guarda como
                                      // archivo a secas. Antes caía en JSON, y
                                      // Android le pone al fichero la
                                      // extensión del tipo que se le declara:
                                      // el PDF acababa descargándose como
                                      // .json.
                                      : "application/octet-stream");
                                  Uri uri = ctx.getContentResolver().insert(
                                      MediaStore.Downloads.EXTERNAL_CONTENT_URI, v);
                                  if (uri == null) return;
                                  try (OutputStream os = ctx.getContentResolver().openOutputStream(uri)) {
                                      if (os != null) os.write(data);
                                  }
                              } else {
                                  java.io.File f = new java.io.File(
                                      Environment.getExternalStoragePublicDirectory(
                                          Environment.DIRECTORY_DOWNLOADS), fname);
                                  try (java.io.FileOutputStream fos = new java.io.FileOutputStream(f)) {
                                      fos.write(data);
                                  }
                                  android.media.MediaScannerConnection.scanFile(
                                      ctx, new String[]{f.getAbsolutePath()}, null, null);
                              }
                              new Handler(Looper.getMainLooper()).post(() ->
                                  Toast.makeText(ctx, "Guardado en Descargas: " + fname, Toast.LENGTH_LONG).show());
                          } catch (Exception e) {
                              new Handler(Looper.getMainLooper()).post(() ->
                                  Toast.makeText(ctx, "Error al guardar", Toast.LENGTH_SHORT).show());
                          }
                      }
                      @JavascriptInterface
                      public String getPref(String key) {
                          return ctx.getSharedPreferences(PREFS, Context.MODE_PRIVATE)
                              .getString(key, null);
                      }

                      @JavascriptInterface
                      public void removePref(String key) {
                          ctx.getSharedPreferences(PREFS, Context.MODE_PRIVATE)
                              .edit().remove(key).apply();
                      }

                      @JavascriptInterface
                      public void openExternalUrl(String url) {
                          try {
                              Intent intent = new Intent(Intent.ACTION_VIEW, Uri.parse(url));
                              intent.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK);
                              ctx.startActivity(intent);
                          } catch (Exception e) {}
                      }

                      @JavascriptInterface
                      public void downloadAndInstallApk(String url) {
                          new Thread(() -> {
                              try {
                                  java.net.URL apkUrl = new java.net.URL(url);
                                  java.net.HttpURLConnection conn = (java.net.HttpURLConnection) apkUrl.openConnection();
                                  conn.setRequestProperty("User-Agent", "HorasEMT/1.0");
                                  conn.setInstanceFollowRedirects(true);
                                  // Sin estos topes, una conexión que se cae a
                                  // medias deja el read() esperando para siempre:
                                  // la barra se queda clavada y no salta ningún
                                  // error, que es justo lo que se veía.
                                  conn.setConnectTimeout(20000);
                                  conn.setReadTimeout(30000);
                                  conn.connect();
                                  int totalSize = conn.getContentLength();
                                  java.io.File apkFile = new java.io.File(ctx.getCacheDir(), "update.apk");
                                  try (java.io.InputStream in = conn.getInputStream();
                                       java.io.FileOutputStream out = new java.io.FileOutputStream(apkFile)) {
                                      byte[] buf = new byte[65536];
                                      int read; long downloaded = 0; int ultimoPct = -1;
                                      while ((read = in.read(buf)) != -1) {
                                          out.write(buf, 0, read);
                                          downloaded += read;
                                          if (totalSize > 0) {
                                              final int pct = (int)(downloaded * 100L / totalSize);
                                              // Solo cuando cambia el número. Antes se
                                              // evaluaba JavaScript en cada trozo: con
                                              // 7 MB eran casi mil saltos al hilo de la
                                              // interfaz, que se atascaba y parecía que
                                              // la descarga no avanzaba.
                                              if (pct != ultimoPct) {
                                                  ultimoPct = pct;
                                                  ((android.app.Activity) ctx).runOnUiThread(() -> {
                                                      try {
                                                          ((BridgeActivity) ctx).getBridge().getWebView()
                                                              .evaluateJavascript("app._onUpdateProgress(" + pct + ")", null);
                                                      } catch (Exception ignored) {}
                                                  });
                                              }
                                          }
                                      }
                                  }
                                  conn.disconnect();
                                  Uri apkUri = FileProvider.getUriForFile(ctx,
                                      ctx.getPackageName() + ".fileprovider", apkFile);
                                  Intent install = new Intent(Intent.ACTION_VIEW);
                                  install.setDataAndType(apkUri, "application/vnd.android.package-archive");
                                  install.addFlags(Intent.FLAG_GRANT_READ_URI_PERMISSION);
                                  install.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK);
                                  ctx.startActivity(install);
                              } catch (Exception e) {
                                  ((android.app.Activity) ctx).runOnUiThread(() -> {
                                      Toast.makeText(ctx, "Error al descargar: " + e.getMessage(), Toast.LENGTH_LONG).show();
                                      try {
                                          ((BridgeActivity) ctx).getBridge().getWebView()
                                              .evaluateJavascript("app._onUpdateError()", null);
                                      } catch (Exception ignored) {}
                                  });
                              }
                          }).start();
                      }

                      @JavascriptInterface
                      public void fetchImageBase64(final String imgUrl, final String callbackFn) {
                          new Thread(() -> {
                              String result = null;
                              try {
                                  java.net.HttpURLConnection conn = (java.net.HttpURLConnection) new java.net.URL(imgUrl).openConnection();
                                  conn.setConnectTimeout(10000); conn.setReadTimeout(10000);
                                  conn.setRequestProperty("User-Agent", "Mozilla/5.0");
                                  conn.connect();
                                  java.io.InputStream is = conn.getInputStream();
                                  java.io.ByteArrayOutputStream buf = new java.io.ByteArrayOutputStream();
                                  byte[] tmp = new byte[4096]; int n;
                                  while ((n = is.read(tmp)) != -1) buf.write(tmp, 0, n);
                                  String mime = conn.getContentType() != null ? conn.getContentType().split(";")[0] : "image/jpeg";
                                  result = "data:" + mime + ";base64," + android.util.Base64.encodeToString(buf.toByteArray(), android.util.Base64.NO_WRAP);
                              } catch (Exception e) {}
                              final String r = result;
                              new android.os.Handler(android.os.Looper.getMainLooper()).post(() -> {
                                  if (getBridge() != null)
                                      getBridge().getWebView().evaluateJavascript(callbackFn + "(" + (r != null ? "'" + r + "'" : "null") + ")", null);
                              });
                          }).start();
                      }

                      // Devuelve false si no hay navegador que la atienda, y
                      // entonces se sigue con el cuadro de siempre.
                      private boolean abrirPestanaNavegador(String authUrl) {
                          try {
                              Intent i = new Intent(Intent.ACTION_VIEW, android.net.Uri.parse(authUrl));
                              // Los extras de "pestaña personalizada": si el navegador
                              // los entiende se abre dentro de la app con su color, y
                              // si no, se abre el navegador de siempre. En los dos
                              // casos comparte la sesión de Google del teléfono, que
                              // es lo que se busca.
                              android.os.Bundle extras = new android.os.Bundle();
                              extras.putBinder("android.support.customtabs.extra.SESSION", null);
                              i.putExtras(extras);
                              i.putExtra("android.support.customtabs.extra.TOOLBAR_COLOR", 0xFF1565C0);
                              if (!(ctx instanceof android.app.Activity))
                                  i.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK);
                              ctx.startActivity(i);
                              return true;
                          } catch (Exception e) {
                              return false;
                          }
                      }

                      @JavascriptInterface
                      public void performOAuthInWebView(final String authUrl, final boolean isSilent) {
                          // La entrada normal se abre ahora en el navegador del
                          // teléfono, como una pestaña dentro de la app. Así Google
                          // ve la sesión que ya hay en el móvil y ofrece las cuentas
                          // para elegir; el cuadro de aquí abajo era un navegador
                          // aparte que empezaba de cero y pedía el correo entero.
                          // La renovación callada sigue por el cuadro: no puede
                          // abrir nada a la vista.
                          if (!isSilent && abrirPestanaNavegador(authUrl)) return;
                          ((android.app.Activity) ctx).runOnUiThread(new Runnable() {
                              @Override public void run() {
                                  final android.webkit.WebView wv = new android.webkit.WebView(ctx);
                                  wv.getSettings().setJavaScriptEnabled(true);
                                  wv.getSettings().setDomStorageEnabled(true);
                                  wv.getSettings().setUserAgentString("Mozilla/5.0 (Linux; Android 10; Mobile) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Mobile Safari/537.36");
                                  // Entrar con Google va saltando entre dominios suyos, y sin
                                  // cookies de terceros la sesión no se sostiene: cada vez
                                  // tocaba escribir el correo entero en vez de elegirlo.
                                  android.webkit.CookieManager.getInstance().setAcceptCookie(true);
                                  android.webkit.CookieManager.getInstance().setAcceptThirdPartyCookies(wv, true);
                                  final android.app.Dialog[] dlgRef = {null};
                                  final boolean[] handled = {false};
                                  if (!isSilent) {
                                      android.app.Dialog dlg = new android.app.Dialog(ctx, android.R.style.Theme_Black_NoTitleBar_Fullscreen);
                                      android.widget.FrameLayout fl = new android.widget.FrameLayout(ctx);
                                      fl.addView(wv, new android.widget.FrameLayout.LayoutParams(-1, -1));
                                      dlg.setContentView(fl);
                                      if (dlg.getWindow() != null) dlg.getWindow().setLayout(-1, -1);
                                      dlgRef[0] = dlg;
                                  }
                                  wv.setWebViewClient(new android.webkit.WebViewClient() {
                                      // El sitio cambió de nombre —de registro-horario-emt a
                                      // emt-palma-movilidad— y Google puede devolver la entrada
                                      // por cualquiera de los dos mientras la dirección vieja
                                      // siga apuntada allí. Valen los dos.
                                      private boolean esNuestro(String host) {
                                          return "emt-palma-movilidad.vercel.app".equals(host)
                                              || "registro-horario-emt.vercel.app".equals(host);
                                      }
                                      private void reportResult(final String queryOrFragment) {
                                          if (handled[0]) return;
                                          handled[0] = true;
                                          // Guardarlas en disco antes de cerrar el cuadro: si no,
                                          // la sesión se va con él y la próxima vez Google vuelve
                                          // a preguntar el correo desde cero.
                                          try { android.webkit.CookieManager.getInstance().flush(); } catch (Exception e) {}
                                          if (dlgRef[0] != null) try { dlgRef[0].dismiss(); } catch (Exception e) {}
                                          ((android.app.Activity) ctx).runOnUiThread(new Runnable() {
                                              @Override public void run() {
                                                  try {
                                                      String code = null;
                                                      if (queryOrFragment != null) {
                                                          for (String p : queryOrFragment.split("&")) {
                                                              String[] kv = p.split("=", 2);
                                                              if (kv.length < 2) continue;
                                                              if ("code".equals(kv[0])) { try { code = java.net.URLDecoder.decode(kv[1], "UTF-8"); } catch (Exception e) { code = kv[1]; } }
                                                          }
                                                      }
                                                      final String js = code != null
                                                          ? "app._onOAuthCode('" + code.replace("'", "\\'") + "'," + isSilent + ")"
                                                          : "app._onOAuthCode(null," + isSilent + ")";
                                                      ((BridgeActivity) ctx).getBridge().getWebView().evaluateJavascript(js, null);
                                                  } catch (Exception e) {}
                                              }
                                          });
                                      }
                                      @Override
                                      public boolean shouldOverrideUrlLoading(android.webkit.WebView view, android.webkit.WebResourceRequest req) {
                                          if (handled[0]) return true;
                                          String u = req.getUrl().toString();
                                          String host = req.getUrl().getHost() == null ? "" : req.getUrl().getHost();
                                          String qry  = req.getUrl().getQuery() == null ? "" : req.getUrl().getQuery();
                                          // La vuelta de Google es la que trae el código a la
                                          // dirección de la app. Antes bastaba con que la URL
                                          // nombrara el dominio, y el enlace de continuar del
                                          // aviso de "aplicación no verificada" lo nombra: se
                                          // tragaba ese toque y cancelaba la entrada justo a
                                          // quien intentaba seguir adelante.
                                          // Valen los dos dominios: el de ahora y el de antes,
                                          // que Vercel sigue redirigiendo. Si solo valiera uno,
                                          // quien tuviera la otra dirección guardada en Google se
                                          // quedaría sin poder entrar.
                                          if (esNuestro(host)
                                                  && (qry.contains("code=") || qry.contains("error="))) {
                                              reportResult(qry);
                                              return true;
                                          }
                                          if (u.contains("silent_failed=1") || u.contains("error=access_denied") || u.contains("error=interaction_required")) {
                                              reportResult(null); return true;
                                          }
                                          return false;
                                      }
                                      @Override
                                      public void onPageFinished(android.webkit.WebView view, String pageUrl) {
                                          if (handled[0] || pageUrl == null) return;
                                          if (!esNuestro(android.net.Uri.parse(pageUrl).getHost())) return;
                                          view.evaluateJavascript(
                                              "(function(){var q=(window.location.search||'').replace(/^\\?/,'');return q.indexOf('code=')>=0?q:'';})();",
                                              new android.webkit.ValueCallback<String>() {
                                                  @Override public void onReceiveValue(String val) {
                                                      if (val != null && !val.equals("null") && !val.equals("\"\"") && val.length() > 4) {
                                                          String clean = val.startsWith("\"") ? val.substring(1, val.length()-1) : val;
                                                          reportResult(clean);
                                                      }
                                                      // Sin código no se da por perdida la entrada:
                                                      // puede ser una parada de camino, y cerrar
                                                      // aquí el cuadro dejaba fuera a quien seguía.
                                                  }
                                              }
                                          );
                                      }
                                  });
                                  wv.loadUrl(authUrl);
                                  if (dlgRef[0] != null) dlgRef[0].show();
                              }
                          });
                      }
                      // Compartir un archivo ya adjuntado, con la app que elija.
                      // Lo de antes era descargarlo y abrir un correo vacío: se
                      // llegaba a la app de correo y el archivo no estaba.
                      @JavascriptInterface
                      public void compartirArchivo(String nombre, String mime, String base64,
                                                   String asunto, String destino) {
                          try {
                              byte[] datos = android.util.Base64.decode(base64, android.util.Base64.DEFAULT);
                              java.io.File dir = new java.io.File(ctx.getCacheDir(), "compartir");
                              if (!dir.exists()) dir.mkdirs();
                              String limpio = (nombre == null || nombre.isEmpty()) ? "archivo" : nombre;
                              limpio = limpio.replaceAll("[\\\\/:*?\"<>|]", "_");
                              java.io.File f = new java.io.File(dir, limpio);
                              java.io.FileOutputStream fos = new java.io.FileOutputStream(f);
                              fos.write(datos);
                              fos.close();
                              Uri uri = FileProvider.getUriForFile(
                                  ctx, ctx.getPackageName() + ".fileprovider", f);
                              Intent envio = new Intent(Intent.ACTION_SEND);
                              envio.setType(mime == null || mime.isEmpty() ? "*/*" : mime);
                              envio.putExtra(Intent.EXTRA_STREAM, uri);
                              if (asunto != null && !asunto.isEmpty())
                                  envio.putExtra(Intent.EXTRA_SUBJECT, asunto);
                              if (destino != null && !destino.isEmpty())
                                  envio.putExtra(Intent.EXTRA_EMAIL, new String[]{ destino });
                              envio.putExtra(Intent.EXTRA_TEXT, "Te adjunto " + limpio + ".");
                              envio.addFlags(Intent.FLAG_GRANT_READ_URI_PERMISSION);
                              Intent chooser = Intent.createChooser(envio, "Enviar con");
                              chooser.addFlags(Intent.FLAG_GRANT_READ_URI_PERMISSION);
                              ctx.startActivity(chooser);
                          } catch (Exception e) {
                              ((android.app.Activity) ctx).runOnUiThread(() ->
                                  Toast.makeText(ctx, "No se pudo compartir el archivo", Toast.LENGTH_LONG).show());
                          }
                      }

