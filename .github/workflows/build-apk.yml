                      @JavascriptInterface
                      public void registerGeofences(String locationsJson) {
                          try {
                              org.json.JSONArray arr = new org.json.JSONArray(locationsJson);
                              GeofencingClient client = LocationServices.getGeofencingClient(ctx);
                              Intent gi = new Intent(ctx, GeofenceReceiver.class);
                              int piFlags = PendingIntent.FLAG_UPDATE_CURRENT
                                  | (Build.VERSION.SDK_INT >= Build.VERSION_CODES.M ? PendingIntent.FLAG_MUTABLE : 0);
                              PendingIntent gpi = PendingIntent.getBroadcast(ctx, 9999, gi, piFlags);
                              client.removeGeofences(gpi);
                              if (arr.length() == 0) return;
                              List<Geofence> fences = new ArrayList<>();
                              for (int i = 0; i < arr.length(); i++) {
                                  org.json.JSONObject loc = arr.getJSONObject(i);
                                  fences.add(new Geofence.Builder()
                                      .setRequestId("work_" + i)
                                      .setCircularRegion(loc.getDouble("lat"), loc.getDouble("lng"), 300)
                                      .setExpirationDuration(Geofence.NEVER_EXPIRE)
                                      .setTransitionTypes(Geofence.GEOFENCE_TRANSITION_ENTER | Geofence.GEOFENCE_TRANSITION_DWELL)
                                      .setLoiteringDelay(60000)
                                      .build());
                              }
                              GeofencingRequest request = new GeofencingRequest.Builder()
                                  .setInitialTrigger(GeofencingRequest.INITIAL_TRIGGER_ENTER | GeofencingRequest.INITIAL_TRIGGER_DWELL)
                                  .addGeofences(fences)
                                  .build();
                              if (ActivityCompat.checkSelfPermission(ctx, android.Manifest.permission.ACCESS_FINE_LOCATION)
                                      == android.content.pm.PackageManager.PERMISSION_GRANTED) {
                                  client.addGeofences(request, gpi);
                              }
                              ctx.getSharedPreferences(PREFS, Context.MODE_PRIVATE)
                                  .edit().putString("geofenceLocations", locationsJson).apply();
                          } catch (Exception e) {}
                      }

                      @JavascriptInterface
                      public void removeGeofences() {
                          try {
                              GeofencingClient client = LocationServices.getGeofencingClient(ctx);
                              Intent gi = new Intent(ctx, GeofenceReceiver.class);
                              int piFlags = PendingIntent.FLAG_UPDATE_CURRENT
                                  | (Build.VERSION.SDK_INT >= Build.VERSION_CODES.M ? PendingIntent.FLAG_MUTABLE : 0);
                              client.removeGeofences(PendingIntent.getBroadcast(ctx, 9999, gi, piFlags));
                              ctx.getSharedPreferences(PREFS, Context.MODE_PRIVATE)
                                  .edit().remove("geofenceLocations").apply();
                          } catch (Exception e) {}
                      }
                  }, "AndroidBridge");
              }

              @Override
              public void onBackPressed() {
                  android.webkit.WebView wv = (getBridge() != null) ? getBridge().getWebView() : null;
                  if (wv == null) { moveTaskToBack(true); return; }
                  // Que decida la app: aquí había una copia en Java de una lista
                  // de tres cuadros, y cualquier cosa nueva que se abriera —una
                  // conversación, un lugar, el visor de una foto— se saltaba la
                  // lista y atrás cerraba la aplicación con el cuadro puesto.
                  wv.evaluateJavascript(
                      "(function(){try{return app.atras()?'ok':'exit';}catch(e){return 'exit';}})()",
                      result -> {
                          if (result == null || result.contains("exit")) {
                              moveTaskToBack(true);
                          }
                      }
                  );
              }

              // Native geofencing — fires when user enters a work location, even with app killed
              public static class GeofenceReceiver extends BroadcastReceiver {

                  // El aro que ha saltado se llama work_0, work_1... y ese
                  // número es su sitio en la lista de ubicaciones guardadas.
                  private static int cualSalto(GeofencingEvent event) {
                      try {
                          java.util.List<Geofence> gs = event.getTriggeringGeofences();
                          if (gs == null || gs.isEmpty()) return -1;
                          String id = gs.get(0).getRequestId();
                          if (id == null || !id.startsWith("work_")) return -1;
                          return Integer.parseInt(id.substring(5));
                      } catch (Exception e) { return -1; }
                  }

                  private static boolean esLaPrimera(GeofencingEvent event) {
                      return cualSalto(event) == 0;
                  }

                  // ¿Ya registró hoy en ese mismo lugar? La app deja escrito
                  // "yyyyMMdd~lugar|lugar" cada vez que guarda una jornada.
                  private static boolean yaRegistradoAhi(Context ctx, SharedPreferences prefs,
                                                        String today, GeofencingEvent event) {
                      int i = cualSalto(event);
                      if (i < 0) return today.equals(prefs.getString("lastRegisteredDate", ""));
                      String nombre = "";
                      try {
                          org.json.JSONArray arr = new org.json.JSONArray(
                              prefs.getString("geofenceLocations", "[]"));
                          if (i < arr.length()) nombre = arr.getJSONObject(i).optString("name", "");
                      } catch (Exception e) {}
                      nombre = clave(nombre);
                      if (nombre.isEmpty()) return false;
                      String apuntado = prefs.getString("lugaresHoy", "");
                      int corte = apuntado.indexOf('~');
                      if (corte < 0 || !today.equals(apuntado.substring(0, corte))) return false;
                      for (String x : apuntado.substring(corte + 1).split("\\|")) {
                          if (clave(x).equals(nombre)) return true;
                      }
                      return false;
                  }

                  private static String clave(String s) {
                      if (s == null) return "";
                      String t = java.text.Normalizer.normalize(s.trim().toLowerCase(java.util.Locale.ROOT),
                          java.text.Normalizer.Form.NFD);
                      return t.replaceAll("[\\p{InCombiningDiacriticalMarks}]", "");
                  }

                  @Override
                  public void onReceive(Context ctx, Intent intent) {
                      GeofencingEvent event = GeofencingEvent.fromIntent(intent);
                      if (event == null || event.hasError()) return;
                      int transition = event.getGeofenceTransition();
                      if (transition != Geofence.GEOFENCE_TRANSITION_ENTER && transition != Geofence.GEOFENCE_TRANSITION_DWELL) return;
                      SharedPreferences prefs = ctx.getSharedPreferences(PREFS, Context.MODE_PRIVATE);
                      String gpsMode = prefs.getString("gpsMode", "always");
                      if ("off".equals(gpsMode)) return;
                      if ("schedule".equals(gpsMode)) {
                          String from = prefs.getString("gpsScheduleFrom", "07:00");
                          String to   = prefs.getString("gpsScheduleTo",   "09:00");
                          java.util.Calendar cal = java.util.Calendar.getInstance();
                          int cur = cal.get(java.util.Calendar.HOUR_OF_DAY) * 60 + cal.get(java.util.Calendar.MINUTE);
                          String[] fp = from.split(":"); String[] tp = to.split(":");
                          int f = Integer.parseInt(fp[0]) * 60 + Integer.parseInt(fp[1]);
                          int t = Integer.parseInt(tp[0]) * 60 + Integer.parseInt(tp[1]);
                          boolean ok = f <= t ? (cur >= f && cur <= t) : (cur >= f || cur <= t);
                          if (!ok) return;
                      }
                      String today = new java.text.SimpleDateFormat("yyyyMMdd", java.util.Locale.US).format(new java.util.Date());
                      // Con el día entero registrado no hay nada que avisar, y
                      // así no depende de que el nombre del aro coincida con el
                      // del lugar que se apuntó en la jornada.
                      if (today.equals(prefs.getString("jornadaCompleta", ""))) return;
                      // Con "una vez al día" basta con saber si ya registró hoy.
                      // Con "cada lugar" hay que mirar en cuál: no se repite
                      // donde ya fichó, pero sí se avisa en uno nuevo.
                      String modoAviso = prefs.getString("avisoLugar", "cada");
                      if ("una".equals(modoAviso)) {
                          if (today.equals(prefs.getString("lastRegisteredDate", ""))) return;
                          if (!esLaPrimera(event)) return;
                      } else if (yaRegistradoAhi(ctx, prefs, today, event)) {
                          return;
                      }
                      String inicio = prefs.getString("lastHoraInicio", "");
                      String fin    = prefs.getString("lastHoraFin", "");
                      NotificationManager nm = (NotificationManager) ctx.getSystemService(Context.NOTIFICATION_SERVICE);
                      if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                          nm.createNotificationChannel(new NotificationChannel(
                              CHANNEL_ID, "Trabajo cercano", NotificationManager.IMPORTANCE_HIGH));
                      }
                      int flags = PendingIntent.FLAG_UPDATE_CURRENT
                          | (Build.VERSION.SDK_INT >= Build.VERSION_CODES.M ? PendingIntent.FLAG_IMMUTABLE : 0);
                      Intent bi = new Intent("com.guillermorc.horasemt.REGISTRAR");
                      bi.setPackage("com.guillermorc.horasemt");
                      PendingIntent broadcastPI = PendingIntent.getBroadcast(ctx, 0, bi, flags);
                      Intent oi = new Intent(ctx, MainActivity.class);
                      oi.addFlags(Intent.FLAG_ACTIVITY_SINGLE_TOP);
                      PendingIntent openPI = PendingIntent.getActivity(ctx, 1, oi, flags);
                      nm.notify(1001, new NotificationCompat.Builder(ctx, CHANNEL_ID)
                          .setSmallIcon(android.R.drawable.ic_menu_mylocation)
                          .setContentTitle("📍 EMT - Movilidad")
                          .setContentText("Parece que estás en el trabajo. ¿Registras la jornada?")
                          .setPriority(NotificationCompat.PRIORITY_HIGH)
                          .setContentIntent(openPI)
                          .setAutoCancel(false)
                          .addAction(0, "✅ Registrar jornada", broadcastPI)
                          .addAction(0, "🕐 Otro horario", openPI)
                          .build());
                  }
              }

              // Returns a usable access token, renewing it through the refresh
              // token when the stored one has expired. Runs off the main thread.
              static String obtenerTokenValido(Context ctx) {
                  SharedPreferences prefs = ctx.getSharedPreferences(PREFS, Context.MODE_PRIVATE);
                  String token   = prefs.getString("accessToken", null);
                  String refresh = prefs.getString("refreshToken", null);
                  long   expiry  = 0L;
                  try { expiry = Long.parseLong(prefs.getString("tokenExpiry", "0")); } catch (Exception ignored) {}
                  // A minute of margin so it does not expire mid-request
                  if (token != null && expiry > System.currentTimeMillis() + 60000L) return token;
                  if (refresh == null) return token;
                  try {
                      java.net.URL u = new java.net.URL("https://emt-palma-movilidad.vercel.app/api/auth/refresh");
                      java.net.HttpURLConnection c = (java.net.HttpURLConnection) u.openConnection();
                      c.setRequestMethod("POST");
                      c.setRequestProperty("Content-Type", "application/json");
                      c.setConnectTimeout(15000); c.setReadTimeout(15000);
                      c.setDoOutput(true);
                      org.json.JSONObject body = new org.json.JSONObject();
                      body.put("refresh_token", refresh);
                      c.getOutputStream().write(body.toString().getBytes("UTF-8"));
                      if (c.getResponseCode() != 200) { c.disconnect(); return null; }
                      java.io.BufferedReader br = new java.io.BufferedReader(
                          new java.io.InputStreamReader(c.getInputStream(), "UTF-8"));
                      StringBuilder sb = new StringBuilder(); String l;
                      while ((l = br.readLine()) != null) sb.append(l);
                      c.disconnect();
                      org.json.JSONObject r = new org.json.JSONObject(sb.toString());
                      String nuevo = r.optString("access_token", null);
                      if (nuevo == null || nuevo.isEmpty()) return null;
                      long nuevaExp = System.currentTimeMillis() + (r.optLong("expires_in", 3600) - 60) * 1000L;
                      prefs.edit().putString("accessToken", nuevo)
                                  .putString("tokenExpiry", String.valueOf(nuevaExp)).apply();
                      return nuevo;
                  } catch (Exception e) { return null; }
              }

              // Re-register geofences after phone reboot
              // Aviso de mensajes con la app cerrada. El de trabajo funciona
              // porque lo lanza Android desde aquí, no la app web; los del chat
              // dependían de que la pantalla estuviera viva, así que con la app
              // de fondo no llegaba nada. Esto pregunta cada rato por su cuenta.
              public static final String CHAT_CHANNEL = "chat_emt";

              // El canal de los mensajes con el sonido elegido en la app. En
              // Android el sonido va con el canal y no se puede cambiar después,
              // así que hay uno por sonido; "ninguno" es uno callado.
              static String canalChat(Context ctx) {
                  SharedPreferences p = ctx.getSharedPreferences(PREFS, Context.MODE_PRIVATE);
                  String s = p.getString("notifSoundChat", "default");
                  if (s == null || s.isEmpty()) s = "default";
                  String id = "default".equals(s) ? CHAT_CHANNEL : CHAT_CHANNEL + "_" + s;
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                      try {
                          NotificationManager nm = (NotificationManager) ctx.getSystemService(Context.NOTIFICATION_SERVICE);
                          if (nm != null && nm.getNotificationChannel(id) == null) {
                              NotificationChannel ch = new NotificationChannel(id, "Mensajes", NotificationManager.IMPORTANCE_HIGH);
                              if ("ninguno".equals(s)) {
                                  ch.setSound(null, null);
                              } else if (!"default".equals(s)) {
                                  int res = ctx.getResources().getIdentifier(s, "raw", ctx.getPackageName());
                                  if (res != 0) ch.setSound(
                                      android.net.Uri.parse("android.resource://" + ctx.getPackageName() + "/" + res),
                                      new android.media.AudioAttributes.Builder()
                                          .setUsage(android.media.AudioAttributes.USAGE_NOTIFICATION).build());
                              }
                              nm.createNotificationChannel(ch);
                          }
                      } catch (Exception ignored) { return CHAT_CHANNEL; }
                  }
                  return id;
              }

              public static void programarAvisoChat(Context ctx) {
                  SharedPreferences prefs = ctx.getSharedPreferences(PREFS, Context.MODE_PRIVATE);
                  if (prefs.getString("chatEmail", "").isEmpty()) return;
                  android.app.AlarmManager am =
                      (android.app.AlarmManager) ctx.getSystemService(Context.ALARM_SERVICE);
                  if (am == null) return;
                  int flags = PendingIntent.FLAG_UPDATE_CURRENT
                      | (Build.VERSION.SDK_INT >= Build.VERSION_CODES.M ? PendingIntent.FLAG_IMMUTABLE : 0);
                  Intent i = new Intent(ctx, ChatReceiver.class);
                  PendingIntent pi = PendingIntent.getBroadcast(ctx, 7777, i, flags);
                  // Cinco minutos: más rápido que antes, pero setAndAllowWhileIdle
                  // no da minuto a minuto con la pantalla apagada un rato — en Doze
                  // profundo Android igual la retrasa a su ventana de mantenimiento,
                  // pase lo que pase aquí. Con la app abierta sí se mira cada minuto,
                  // eso lo hace el sondeo de la propia app.
                  long cuando = System.currentTimeMillis() + 5 * 60 * 1000L;
                  // Inexacta y tolerada en Doze: no hace falta permiso especial y
                  // Android la entrega en sus ventanas de mantenimiento.
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.M) {
                      am.setAndAllowWhileIdle(android.app.AlarmManager.RTC_WAKEUP, cuando, pi);
                  } else {
                      am.set(android.app.AlarmManager.RTC_WAKEUP, cuando, pi);
                  }
              }

              // Con la app cerrada, todo lo de arriba lo entrega Android cuando le
              // viene bien: en reposo profundo una alarma "tolerada" puede tardar
              // diez, quince o veinte minutos. Llega, pero tarde, y un cambio de
              // turno que llega tarde no sirve de nada.
              //
              // Esto es lo único que Android deja correr de verdad cada minuto sin
              // tener un servidor de push por medio: un servicio en primer plano.
              // El precio es el aviso fijo y callado de la barra —sin sonido, sin
              // número y sin icono arriba—, que además es lo que impide que el
              // sistema lo mate. Si lo mata igual, las alarmas de antes siguen ahí
              // de red.
              public static class AvisoService extends android.app.Service {
                  public static final String CANAL_FIJO = "vigilante_emt";
                  private static final int ID_FIJO = 1500;
                  private volatile boolean vivo = false;
              
                  @Override public android.os.IBinder onBind(Intent i) { return null; }
              
                  @Override
                  public void onCreate() {
                      super.onCreate();
                      NotificationManager nm =
                          (NotificationManager) getSystemService(Context.NOTIFICATION_SERVICE);
                      if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O && nm != null) {
                          NotificationChannel ch = new NotificationChannel(CANAL_FIJO,
                              "Tu jornada", NotificationManager.IMPORTANCE_MIN);
                          ch.setShowBadge(false);
                          ch.setSound(null, null);
                          nm.createNotificationChannel(ch);
                      }
                      android.app.Notification fija = construir(this);
                      try {
                          if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.Q) {
                              startForeground(ID_FIJO, fija,
                                  android.content.pm.ServiceInfo.FOREGROUND_SERVICE_TYPE_DATA_SYNC);
                          } else {
                              startForeground(ID_FIJO, fija);
                          }
                      } catch (Exception e) { stopSelf(); return; }
                      vivo = true;
                      new Thread(() -> {
                          while (vivo) {
                              try { ChatReceiver.repasar(getApplicationContext()); } catch (Exception ignored) {}
                              if (registradoHoy(getSharedPreferences(PREFS, Context.MODE_PRIVATE))) {
                                  vivo = false;
                                  try {
                                      if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.N) stopForeground(android.app.Service.STOP_FOREGROUND_REMOVE);
                                      else stopForeground(true);
                                  } catch (Exception ignored) {}
                                  stopSelf();
                                  return;
                              }
                              // Y de paso se repinta el aviso fijo: la cuenta
                              // atrás tiene que ir bajando sola.
                              try {
                                  NotificationManager n2 = (NotificationManager)
                                      getSystemService(Context.NOTIFICATION_SERVICE);
                                  if (n2 != null) n2.notify(ID_FIJO, construir(getApplicationContext()));
                              } catch (Exception ignored) {}
                              try { Thread.sleep(60 * 1000L); } catch (InterruptedException e) { return; }
                          }
                      }).start();
                  }

                  // Lo que se ve en la barra mientras la app vigila. Antes ponía
                  // "Mensajes al día", que no le dice nada a nadie: ahora lleva la
                  // jornada de hoy y lo que queda para terminar, que es lo que se
                  // mira veinte veces al día.
                  static android.app.Notification construir(Context ctx) {
                      String[] j = jornadaDeHoy(ctx);
                      int flags = PendingIntent.FLAG_UPDATE_CURRENT
                          | (Build.VERSION.SDK_INT >= Build.VERSION_CODES.M ? PendingIntent.FLAG_IMMUTABLE : 0);
                      Intent oi = new Intent(ctx, MainActivity.class);
                      oi.addFlags(Intent.FLAG_ACTIVITY_SINGLE_TOP);
                      return new NotificationCompat.Builder(ctx, CANAL_FIJO)
                          .setSmallIcon(R.drawable.ic_stat_chat)
                          .setContentTitle(j[0])
                          .setContentText(j[1])
                          .setStyle(new NotificationCompat.BigTextStyle().bigText(j[1]))
                          .setPriority(NotificationCompat.PRIORITY_MIN)
                          .setOngoing(true)
                          .setShowWhen(false)
                          .setContentIntent(PendingIntent.getActivity(ctx, 5, oi, flags))
                          .build();
                  }

                  static String duracion(int minutos) {
                      int h = minutos / 60, m = minutos % 60;
                      if (h > 0 && m > 0) return h + " h " + m + " min";
                      if (h > 0) return h + " h";
                      return m + " min";
                  }

                  // La jornada de hoy sale de lo mismo que ya se guarda para avisar
                  // de los cambios: fecha|lugar|HH:MM-HH:MM|rev. La de ayer no dice
                  // nada de hoy, así que si la fecha no es la de hoy no hay jornada.
                  static String[] jornadaDeHoy(Context ctx) {
                      SharedPreferences p = ctx.getSharedPreferences(PREFS, Context.MODE_PRIVATE);
                      java.util.Calendar c = java.util.Calendar.getInstance();
                      String hoy = String.format(java.util.Locale.US, "%04d%02d%02d",
                          c.get(java.util.Calendar.YEAR), c.get(java.util.Calendar.MONTH) + 1,
                          c.get(java.util.Calendar.DAY_OF_MONTH));
                      String[] t = p.getString("jornadaVista", "").split("\\|", -1);
                      if (t.length < 3 || !t[0].equals(hoy)) {
                          return new String[]{ "Sin jornada para hoy",
                                               "Aqu\u00ed ver\u00e1s la de hoy y lo que te queda" };
                      }
                      String lugar = t[1].trim();
                      String horas = t[2].trim();
                      String titulo = lugar.isEmpty() ? "Jornada de hoy" : lugar;
                      // "09:00-12:30" son once caracteres contando el guion largo
                      if (horas.length() < 11) return new String[]{ titulo, "Sin horario asignado" };
                      int ini, fin;
                      try {
                          ini = Integer.parseInt(horas.substring(0, 2)) * 60
                              + Integer.parseInt(horas.substring(3, 5));
                          fin = Integer.parseInt(horas.substring(6, 8)) * 60
                              + Integer.parseInt(horas.substring(9, 11));
                      } catch (Exception e) {
                          return new String[]{ titulo, "Sin horario asignado" };
                      }
                      // El turno que cruza la medianoche termina al día siguiente
                      if (fin <= ini) fin += 24 * 60;
                      int ahora = c.get(java.util.Calendar.HOUR_OF_DAY) * 60 + c.get(java.util.Calendar.MINUTE);
                      String texto;
                      if (ahora < ini)      texto = "Empiezas en " + duracion(ini - ahora);
                      else if (ahora < fin) texto = "Te quedan " + duracion(fin - ahora);
                      else                  texto = "Jornada terminada \u00b7 " + duracion(fin - ini);
                      return new String[]{ titulo + " \u00b7 " + horas, texto };
                  }
              
                  @Override
                  public int onStartCommand(Intent intent, int flags, int startId) {
                      // Si el sistema lo tumba por falta de memoria, que lo vuelva a levantar
                      return android.app.Service.START_STICKY;
                  }
              
                  @Override
                  public void onDestroy() { vivo = false; super.onDestroy(); }
              }
              
              // Arrancarlo es cosa de dos sitios: al abrir la app y al encender el
              // móvil. Desde el fondo Android puede no dejar, y entonces no pasa
              // nada: quedan la alarma y el trabajo periódico.
              static boolean registradoHoy(SharedPreferences prefs) {
                  String hoy = new java.text.SimpleDateFormat("yyyyMMdd", java.util.Locale.US).format(new java.util.Date());
                  return prefs.getString("lastRegisteredDate", "").startsWith(hoy);
              }

              public static void arrancarVigilante(Context ctx) {
                  SharedPreferences prefs = ctx.getSharedPreferences(PREFS, Context.MODE_PRIVATE);
                  if (prefs.getString("chatEmail", "").isEmpty()) return;
                  // Sin el turno en la barra no hay servicio: Android no deja
                  // tenerlo sin su aviso fijo. Los mensajes y el recordatorio
                  // siguen llegando por la alarma y el trabajo periódico, con
                  // algo más de retraso.
                  // Y con la jornada de hoy ya registrada tampoco: no queda nada
                  // que contar. Vuelve al día siguiente, en cuanto la alarma o
                  // la app lo vuelvan a mirar.
                  if ("0".equals(prefs.getString("avisoTurno", "1")) || registradoHoy(prefs)) {
                      try { ctx.stopService(new Intent(ctx, AvisoService.class)); } catch (Exception ignored) {}
                      return;
                  }
                  try {
                      Intent i = new Intent(ctx, AvisoService.class);
                      if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) ctx.startForegroundService(i);
                      else ctx.startService(i);
                  } catch (Exception ignored) {}
              }
              
              // La cadena de arriba se sostiene sola: cada despertar deja puesto el
              // siguiente. Pero basta con que se pierda uno —el móvil apagado, la app
              // parada por el sistema, un fallo al programar— para que la cadena se
              // rompa y no vuelva a llegar nada hasta que alguien abra la app. Que es
              // justo lo que pasaba. Así que por debajo van dos redes que mantiene el
              // propio Android: una alarma repetida y un trabajo periódico que
              // sobrevive al reinicio y a que la app lleve días sin abrirse.
              public static void asegurarAvisoDeFondo(Context ctx) {
                  SharedPreferences prefs = ctx.getSharedPreferences(PREFS, Context.MODE_PRIVATE);
                  if (prefs.getString("chatEmail", "").isEmpty()) return;
                  try {
                      android.app.AlarmManager am =
                          (android.app.AlarmManager) ctx.getSystemService(Context.ALARM_SERVICE);
                      if (am != null) {
                          int flags = PendingIntent.FLAG_UPDATE_CURRENT
                              | (Build.VERSION.SDK_INT >= Build.VERSION_CODES.M ? PendingIntent.FLAG_IMMUTABLE : 0);
                          PendingIntent pi = PendingIntent.getBroadcast(ctx, 7778,
                              new Intent(ctx, ChatReceiver.class), flags);
                          am.setInexactRepeating(android.app.AlarmManager.RTC_WAKEUP,
                              System.currentTimeMillis() + 15 * 60 * 1000L,
                              android.app.AlarmManager.INTERVAL_FIFTEEN_MINUTES, pi);
                      }
                  } catch (Exception ignored) {}
                  try {
                      android.app.job.JobScheduler js = (android.app.job.JobScheduler)
                          ctx.getSystemService(Context.JOB_SCHEDULER_SERVICE);
                      if (js == null) return;
                      // Si ya está puesto se deja: volver a programarlo le reinicia el
                      // reloj, y a base de reinicios no llegaría a correr nunca.
                      for (android.app.job.JobInfo j : js.getAllPendingJobs()) {
                          if (j.getId() == 7779) return;
                      }
                      js.schedule(new android.app.job.JobInfo.Builder(7779,
                          new android.content.ComponentName(ctx, ChatJob.class))
                          .setRequiredNetworkType(android.app.job.JobInfo.NETWORK_TYPE_ANY)
                          .setPersisted(true)
                          .setPeriodic(15 * 60 * 1000L)
                          .build());
                  } catch (Exception ignored) {}
              }

              // El mismo repaso que hace la alarma, pero lanzado por el planificador
              // de Android, que es quien lo mantiene cuando la app no está delante.
              // El aviso al instante de Firebase: alguien acaba de escribir. Con la
              // app delante, que mire ya; si no, el mismo repaso de siempre, que
              // monta el aviso con su nombre, su texto, su sonido y sus botones.
              public static class PushService extends com.google.firebase.messaging.FirebaseMessagingService {
                  @Override
                  public void onMessageReceived(com.google.firebase.messaging.RemoteMessage msg) {
                      final Context ctx = getApplicationContext();
                      String t0 = msg.getData().get("tipo");
                      final String tipo = t0 == null ? "chat" : t0;
                      // El cuadrante del mes: el aviso sale siempre, también con
                      // la app delante, que dentro no hay nada que lo diga
                      if ("cuadrante".equals(tipo)) {
                          try { ChatReceiver.mirarCuadrante(ctx); } catch (Exception ignored) {}
                          return;
                      }
                      // Con la app delante, que mire ella ya lo que toque
                      final MainActivity act = delante;
                      if (act != null && act.getBridge() != null && act.getBridge().getWebView() != null) {
                          act.getBridge().getWebView().post(() -> act.getBridge().getWebView()
                              .evaluateJavascript("window.dispatchEvent(new CustomEvent('avisoPush',{detail:'"
                                  + tipo.replaceAll("[^a-z]", "") + "'}))", null));
                          return;
                      }
                      // Con la app cerrada: el chat y los cambios de jornada montan su
                      // aviso; lo demás (la lista de gestión, el control de acceso)
                      // solo interesa con la app delante y no hace nada.
                      try {
                          if ("chat".equals(tipo)) ChatReceiver.mirarChat(ctx);
                          else if ("jornada".equals(tipo)) ChatReceiver.mirarJornada(ctx);
                      } catch (Exception ignored) {}
                  }

                  @Override
                  public void onNewToken(String token) {
                      getSharedPreferences(PREFS, Context.MODE_PRIVATE).edit()
                          .putString("pushToken", token == null ? "" : token).apply();
                  }
              }

              public static class ChatJob extends android.app.job.JobService {
                  @Override
                  public boolean onStartJob(final android.app.job.JobParameters params) {
                      final Context app = getApplicationContext();
                      new Thread(() -> {
                          try { ChatReceiver.repasar(app); } catch (Exception ignored) {}
                          jobFinished(params, false);
                      }).start();
                      return true;          // sigue trabajando en ese hilo
                  }
                  @Override
                  public boolean onStopJob(android.app.job.JobParameters params) { return true; }
              }

              public static class ChatReceiver extends BroadcastReceiver {
                  @Override
                  public void onReceive(Context ctx, Intent intent) {
                      final Context app = ctx.getApplicationContext();
                      new Thread(() -> {
                          try { repasar(app); } catch (Exception ignored) {}
                          try { arrancarVigilante(app); } catch (Exception ignored) {}
                          programarAvisoChat(app);     // se vuelve a poner siempre
                      }).start();
                  }

                  // Lo que hay que mirar cada vez, venga de la alarma o del
                  // planificador. Deja apuntada la hora: sin esto no había forma de
                  // saber si el repaso de fondo corría o estaba parado desde hacía
                  // días, que es la diferencia entre un fallo de avisos y otro.
                  static void repasar(Context ctx) {
                      ctx.getSharedPreferences(PREFS, Context.MODE_PRIVATE).edit()
                          .putLong("avisoFondoUltimo", System.currentTimeMillis()).apply();
                      try { mirarChat(ctx); } catch (Exception ignored) {}
                      try { mirarJornada(ctx); } catch (Exception ignored) {}
                      try { mirarCuadrante(ctx); } catch (Exception ignored) {}
                      try { mirarSinRegistrar(ctx); } catch (Exception ignored) {}
                  }

                  // Media hora después de acabar la jornada, si no se ha
                  // registrado nada, un aviso para registrarla. Una vez por
                  // jornada, y se puede quitar en Opciones → Notificaciones. No
                  // se avisa de baja, de vacaciones ni libre, ni sin horario.
                  //
                  // El turno de noche acaba al día siguiente, y para entonces
                  // la jornada "de hoy" ya es otra: por eso, mientras es la de
                  // hoy, se guarda aparte y se mira también pasada la medianoche.
                  static void mirarSinRegistrar(Context ctx) {
                      SharedPreferences prefs = ctx.getSharedPreferences(PREFS, Context.MODE_PRIVATE);
                      if ("0".equals(prefs.getString("avisoRegistrar", "1"))) return;
                      String vista = prefs.getString("jornadaVista", "");
                      String[] v = vista.split("\\|", -1);
                      if (v.length >= 3 && v[2].trim().length() >= 11) {
                          int[] h = horasDe(v[2].trim());
                          if (h != null && h[1] <= h[0]) prefs.edit().putString("turnoNoche", vista).apply();
                      }
                      if (avisarSiToca(ctx, prefs, vista)) return;
                      String noche = prefs.getString("turnoNoche", "");
                      if (!noche.isEmpty() && !noche.equals(vista)) avisarSiToca(ctx, prefs, noche);
                  }

                  // "09:00-12:30" → {540, 750}; null si no se entiende
                  static int[] horasDe(String horas) {
                      try {
                          return new int[]{
                              Integer.parseInt(horas.substring(0, 2)) * 60 + Integer.parseInt(horas.substring(3, 5)),
                              Integer.parseInt(horas.substring(6, 8)) * 60 + Integer.parseInt(horas.substring(9, 11)) };
                      } catch (Exception e) { return null; }
                  }

                  static String diaId(java.util.Calendar c) {
                      return String.format(java.util.Locale.US, "%04d%02d%02d",
                          c.get(java.util.Calendar.YEAR), c.get(java.util.Calendar.MONTH) + 1,
                          c.get(java.util.Calendar.DAY_OF_MONTH));
                  }

                  // Una jornada guardada como fecha|lugar|HH:MM-HH:MM|rev. Avisa
                  // si hace media hora que acabó (y no más de doce: una de hace
                  // días ya no se recuerda) y ese día no se ha registrado.
                  static boolean avisarSiToca(Context ctx, SharedPreferences prefs, String jornada) {
                      String[] t = jornada.split("\\|", -1);
                      if (t.length < 3 || t[0].length() != 8) return false;
                      String fecha = t[0];
                      String horas = t[2].trim();
                      if (horas.length() < 11) return false;
                      int[] h = horasDe(horas);
                      if (h == null) return false;
                      boolean deNoche = h[1] <= h[0];
                      java.util.Calendar fin = java.util.Calendar.getInstance();
                      try {
                          fin.clear();
                          fin.set(Integer.parseInt(fecha.substring(0, 4)), Integer.parseInt(fecha.substring(4, 6)) - 1,
                                  Integer.parseInt(fecha.substring(6, 8)), h[1] / 60, h[1] % 60, 0);
                      } catch (Exception e) { return false; }
                      if (deNoche) fin.add(java.util.Calendar.DAY_OF_MONTH, 1);
                      long desde = fin.getTimeInMillis() + 30 * 60 * 1000L;
                      long ahora = System.currentTimeMillis();
                      if (ahora < desde || ahora > desde + 12 * 3600 * 1000L) return false;
                      if (fecha.equals(prefs.getString("recordatorioAvisado", ""))) return false;
                      if (fecha.equals(prefs.getString("jornadaCompleta", ""))) return false;
                      if (fecha.equals(prefs.getString("jornadaMuda", ""))) return false;
                      String registrado = prefs.getString("lastRegisteredDate", "");
                      // La de noche puede haberse apuntado con el día en que empezó
                      // o con el de después, que es cuando se termina
                      if (registrado.equals(fecha) || (deNoche && registrado.equals(diaId(fin)))) return false;
                      prefs.edit().putString("recordatorioAvisado", fecha).apply();

                      NotificationManager nm =
                          (NotificationManager) ctx.getSystemService(Context.NOTIFICATION_SERVICE);
                      if (nm == null) return true;
                      if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                          nm.createNotificationChannel(new NotificationChannel(
                              CHANNEL_ID, "Trabajo cercano", NotificationManager.IMPORTANCE_HIGH));
                      }
                      int flags = PendingIntent.FLAG_UPDATE_CURRENT
                          | (Build.VERSION.SDK_INT >= Build.VERSION_CODES.M ? PendingIntent.FLAG_IMMUTABLE : 0);
                      Intent oi = new Intent(ctx, MainActivity.class);
                      oi.addFlags(Intent.FLAG_ACTIVITY_SINGLE_TOP);
                      PendingIntent openPI = PendingIntent.getActivity(ctx, 6, oi, flags);
                      String lugar = t[1].trim();
                      String texto = "Tu jornada" + (lugar.isEmpty() ? "" : " en " + lugar)
                          + " (" + horas + ") ha terminado y no la has registrado.";
                      nm.notify(1003, new NotificationCompat.Builder(ctx, CHANNEL_ID)
                          .setSmallIcon(R.drawable.ic_stat_chat)
                          .setContentTitle("\u23F0 Registra tu jornada")
                          .setContentText(texto)
                          .setStyle(new NotificationCompat.BigTextStyle().bigText(texto))
                          .setPriority(NotificationCompat.PRIORITY_HIGH)
                          .setContentIntent(openPI)
                          .setAutoCancel(true)
                          .addAction(0, "\u270F\uFE0F Registrar", openPI)
                          .build());
                      return true;
                  }


                  // Cuando gestión publica el cuadrante del mes, que se entere
                  // aunque tenga la app cerrada. Se aprovecha el mismo
                  // despertar que el de los mensajes: no cuesta otra alarma.
                  // La primera vez no avisa: se apunta lo que hay y a partir de
                  // ahí, lo que llegue nuevo.
                  static void mirarCuadrante(Context ctx) throws Exception {
                      SharedPreferences prefs = ctx.getSharedPreferences(PREFS, Context.MODE_PRIVATE);
                      String url = prefs.getString("cuadranteUrl", "");
                      if (url.isEmpty()) return;

                      java.net.HttpURLConnection c =
                          (java.net.HttpURLConnection) new java.net.URL(url).openConnection();
                      c.setConnectTimeout(15000);
                      c.setReadTimeout(15000);
                      c.setRequestProperty("User-Agent", "HorasEMT/1.0");
                      if (c.getResponseCode() != 200) { c.disconnect(); return; }
                      StringBuilder sb = new StringBuilder();
                      java.io.BufferedReader br = new java.io.BufferedReader(
                          new java.io.InputStreamReader(c.getInputStream(), "UTF-8"));
                      String linea;
                      while ((linea = br.readLine()) != null) sb.append(linea);
                      br.close(); c.disconnect();

                      org.json.JSONObject o = new org.json.JSONObject(sb.toString());
                      // Solo el que publica gestión: el que se haya subido uno
                      // para sí mismo no lleva quién lo publicó.
                      if (o.optString("publicadoPor", "").isEmpty()) return;
                      String cuando = o.optString("actualizado", "");
                      if (cuando.isEmpty()) return;
                      String visto = prefs.getString("cuadranteVisto", "");
                      prefs.edit().putString("cuadranteVisto", cuando).apply();
                      if (visto.isEmpty() || cuando.compareTo(visto) <= 0) return;

                      NotificationManager nm =
                          (NotificationManager) ctx.getSystemService(Context.NOTIFICATION_SERVICE);
                      if (nm == null) return;
                      if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                          nm.createNotificationChannel(new NotificationChannel(
                              CHAT_CHANNEL, "Mensajes", NotificationManager.IMPORTANCE_HIGH));
                      }
                      String texto = "Ya est\u00e1 el cuadrante del mes. M\u00edralo en Historial.";
                      int flags = PendingIntent.FLAG_UPDATE_CURRENT
                          | (Build.VERSION.SDK_INT >= Build.VERSION_CODES.M ? PendingIntent.FLAG_IMMUTABLE : 0);
                      Intent oi = new Intent(ctx, MainActivity.class);
                      oi.addFlags(Intent.FLAG_ACTIVITY_SINGLE_TOP);
                      // Al tocarlo se abre en Historial, y hasta que lo vea
                      // queda en la campana de la app
                      oi.putExtra("abrirCuadrante", true);
                      prefs.edit().putString("cuadrantePend", cuando).apply();
                      PendingIntent pi = PendingIntent.getActivity(ctx, 4, oi, flags);
                      nm.notify(1004, new NotificationCompat.Builder(ctx, canalChat(ctx))
                          .setSmallIcon(R.drawable.ic_stat_chat)
                          .setContentTitle("Cuadrante del mes publicado")
                          .setContentText(texto)
                          .setStyle(new NotificationCompat.BigTextStyle().bigText(texto))
                          .setPriority(NotificationCompat.PRIORITY_HIGH)
                          .setContentIntent(pi)
                          .setAutoCancel(true)
                          .build());
                  }


                  // Si gestión le cambia el sitio o la hora de hoy, que se
                  // entere aunque tenga la app cerrada, y no cuando ya va de
                  // camino al lugar de antes. Se aprovecha el mismo despertar
                  // que el de los mensajes: no cuesta otra alarma.
                  static void mirarJornada(Context ctx) throws Exception {
                      SharedPreferences prefs = ctx.getSharedPreferences(PREFS, Context.MODE_PRIVATE);
                      // Sin comunicación con el Departamento no hay mensajes ni cambios de gestión
                      if ("0".equals(prefs.getString("comunicacion", "1"))) return;
                      String email = prefs.getString("chatEmail", "");
                      String base  = prefs.getString("asignacionUrl", "");
                      if (email.isEmpty() || base.isEmpty()) return;

                      java.net.HttpURLConnection c = (java.net.HttpURLConnection)
                          new java.net.URL(base + "?mio=" + java.net.URLEncoder.encode(email, "UTF-8"))
                              .openConnection();
                      c.setConnectTimeout(15000);
                      c.setReadTimeout(15000);
                      c.setRequestProperty("User-Agent", "HorasEMT/1.0");
                      if (c.getResponseCode() != 200) { c.disconnect(); return; }
                      StringBuilder sb = new StringBuilder();
                      java.io.BufferedReader br = new java.io.BufferedReader(
                          new java.io.InputStreamReader(c.getInputStream(), "UTF-8"));
                      String linea;
                      while ((linea = br.readLine()) != null) sb.append(linea);
                      br.close(); c.disconnect();

                      org.json.JSONObject a = new org.json.JSONObject(sb.toString());
                      String fecha = a.optString("fecha", "");
                      if (fecha.isEmpty()) return;
                      // De baja, de vacaciones o libre no hay jornada que registrar
                      boolean muda = false;
                      for (String k : new String[]{ "baja", "vacaciones", "libre" }) {
                          String v = a.has(k) && !a.isNull(k) ? a.optString(k, "") : "";
                          if (!v.isEmpty() && !"false".equals(v) && !"0".equals(v)) muda = true;
                      }
                      if (muda) prefs.edit().putString("jornadaMuda", fecha).apply();
                      String lugar = a.optString("lugar", "");
                      org.json.JSONObject h = a.optJSONObject("horario");
                      String horas = "";
                      if (h != null && !h.optString("i", "").isEmpty() && !h.optString("f", "").isEmpty())
                          horas = h.optString("i") + "\u2013" + h.optString("f");
                      // El sello de cuándo se le asignó entra en la huella: volver a
                      // ponerle la misma jornada que ya tenía es un cambio, y hasta ahora
                      // no se avisaba porque el antes y el después salían idénticos.
                      String rev = String.valueOf(a.optLong("rev", 0));
                      String ahora = fecha + "|" + lugar + "|" + horas + "|" + rev;

                      String visto = prefs.getString("jornadaVista", "");
                      if (ahora.equals(visto)) return;
                      prefs.edit().putString("jornadaVista", ahora).apply();
                      // La primera vez no hay con qué comparar, y cambiar de
                      // día tampoco es ningún cambio: la jornada de mañana es
                      // otra por definición.
                      if (visto.isEmpty()) return;
                      String[] antes = visto.split("\\|", -1);
                      if (antes.length < 3 || !antes[0].equals(fecha)) return;

                      String texto = "";
                      if (!antes[1].equalsIgnoreCase(lugar))
                          texto = lugar.isEmpty() ? "Te han quitado el lugar" : "Ahora te toca en " + lugar;
                      if (!antes[2].equals(horas)) {
                          String t = horas.isEmpty() ? "Te han quitado el horario" : "Horario " + horas;
                          texto = texto.isEmpty() ? t : texto + " \u00b7 " + t;
                      }
                      // Sin cambios pero reasignada: alguien le ha tocado la jornada y
                      // tiene que enterarse igual.
                      if (texto.isEmpty() && antes.length > 3 && !antes[3].equals(rev)) {
                          texto = (lugar.isEmpty() ? "Sin lugar" : lugar)
                                + (horas.isEmpty() ? "" : " \u00b7 " + horas);
                      }
                      if (texto.isEmpty()) return;

                      NotificationManager nm =
                          (NotificationManager) ctx.getSystemService(Context.NOTIFICATION_SERVICE);
                      if (nm == null) return;
                      if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                          nm.createNotificationChannel(new NotificationChannel(
                              CHAT_CHANNEL, "Mensajes", NotificationManager.IMPORTANCE_HIGH));
                      }
                      int flags = PendingIntent.FLAG_UPDATE_CURRENT
                          | (Build.VERSION.SDK_INT >= Build.VERSION_CODES.M ? PendingIntent.FLAG_IMMUTABLE : 0);
                      Intent oi = new Intent(ctx, MainActivity.class);
                      oi.addFlags(Intent.FLAG_ACTIVITY_SINGLE_TOP);
                      PendingIntent pi = PendingIntent.getActivity(ctx, 3, oi, flags);
                      nm.notify(1003, new NotificationCompat.Builder(ctx, canalChat(ctx))
                          .setSmallIcon(R.drawable.ic_stat_chat)
                          .setContentTitle("Te han cambiado la jornada de hoy")
                          .setContentText(texto)
                          .setStyle(new NotificationCompat.BigTextStyle().bigText(texto))
                          .setPriority(NotificationCompat.PRIORITY_HIGH)
                          .setContentIntent(pi)
                          .setAutoCancel(true)
                          .build());
                  }

                  // El mismo número que le pone la app web a cada conversación,
                  // para que el aviso puesto desde fuera y el puesto desde dentro
                  // sean el mismo y no se dupliquen.
                  static int idDeAviso(String conv) {
                      int h = 0;
                      for (int i = 0; i < conv.length(); i++) h = h * 31 + conv.charAt(i);
                      return 2000 + Math.abs(h % 90000);
                  }

                  static void mirarChat(Context ctx) throws Exception {
                      SharedPreferences prefs = ctx.getSharedPreferences(PREFS, Context.MODE_PRIVATE);
                      // Sin comunicación con el Departamento no hay mensajes ni cambios de gestión
                      if ("0".equals(prefs.getString("comunicacion", "1"))) return;
                      String email = prefs.getString("chatEmail", "");
                      if (email.isEmpty()) return;
                      boolean esGestor = prefs.getBoolean("chatEsGestor", false);
                      String visto = prefs.getString("chatVisto", "");
                      String url = prefs.getString("chatUrl", "") + "?resumen=1"
                          + (esGestor ? "" : "&email=" + java.net.URLEncoder.encode(email, "UTF-8"));

                      java.net.HttpURLConnection c =
                          (java.net.HttpURLConnection) new java.net.URL(url).openConnection();
                      c.setConnectTimeout(15000);
                      c.setReadTimeout(15000);
                      c.setRequestProperty("User-Agent", "HorasEMT/1.0");
                      if (c.getResponseCode() != 200) { c.disconnect(); return; }
                      StringBuilder sb = new StringBuilder();
                      java.io.BufferedReader br = new java.io.BufferedReader(
                          new java.io.InputStreamReader(c.getInputStream(), "UTF-8"));
                      String linea;
                      while ((linea = br.readLine()) != null) sb.append(linea);
                      br.close(); c.disconnect();

                      org.json.JSONArray arr = new org.json.JSONArray(sb.toString());
                      String masNuevo = visto;
                      java.util.List<org.json.JSONObject> nuevas = new java.util.ArrayList<>();
                      for (int i = 0; i < arr.length(); i++) {
                          org.json.JSONObject n = arr.getJSONObject(i);
                          if (n.optBoolean("archivada", false)) continue;
                          String en = n.optString("en", "");
                          String de = n.optString("de", "");
                          // Al gestor le llega el resumen entero, y ahí van también las
                          // conversaciones entre compañeros —las que le escriben al
                          // desarrollador, por ejemplo—. Esas no son suyas: ni salen en
                          // su bandeja ni le tienen que sonar en el móvil.
                          if (esGestor && "companero".equals(n.optString("tipo", ""))) continue;
                          // Lo que he escrito yo no me lo tiene que avisar nadie
                          boolean mio = esGestor ? "gestor".equals(de)
                                                 : (email.equalsIgnoreCase(de) || "trabajador".equals(de));
                          if (mio || en.isEmpty() || en.compareTo(visto) <= 0) continue;
                          if (n.optString("id", "").isEmpty()) continue;
                          nuevas.add(n);
                          if (en.compareTo(masNuevo) > 0) masNuevo = en;
                      }
                      if (nuevas.isEmpty()) return;
                      prefs.edit().putString("chatVisto", masNuevo).apply();

                      NotificationManager nm =
                          (NotificationManager) ctx.getSystemService(Context.NOTIFICATION_SERVICE);
                      if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                          nm.createNotificationChannel(new NotificationChannel(
                              CHAT_CHANNEL, "Mensajes", NotificationManager.IMPORTANCE_HIGH));
                      }
                      int flags = PendingIntent.FLAG_UPDATE_CURRENT
                          | (Build.VERSION.SDK_INT >= Build.VERSION_CODES.M ? PendingIntent.FLAG_IMMUTABLE : 0);
                      // La respuesta escrita viaja dentro del Intent, así que ese de
                      // ahí abajo no puede ser inmutable como los demás.
                      int flagsAbiertos = PendingIntent.FLAG_UPDATE_CURRENT
                          | (Build.VERSION.SDK_INT >= Build.VERSION_CODES.S ? PendingIntent.FLAG_MUTABLE : 0);
                      // Un aviso por conversación, con su nombre y su mensaje. Antes
                      // era uno solo que decía "tienes 3 mensajes" y obligaba a entrar
                      // para saber de qué iban; y con varias no se podía contestar,
                      // porque no se sabía a cuál. Ahora cada uno lleva su "Responder"
                      // y su "Marcar leído", y los dos se resuelven sin abrir la app.
                      for (org.json.JSONObject n : nuevas) {
                          String id = n.optString("id", "");
                          int idAviso = idDeAviso(id);
                          String quien = n.optString("quien", "");
                          String cuerpo = n.optString("texto", "");
                          if (quien.isEmpty()) quien = "Mensaje nuevo";
                          if (cuerpo.isEmpty()) cuerpo = "Toca para leerlo en la aplicación";

                          Intent oi = new Intent(ctx, MainActivity.class);
                          oi.addFlags(Intent.FLAG_ACTIVITY_SINGLE_TOP);
                          oi.putExtra("abrirNotas", true);
                          PendingIntent pi = PendingIntent.getActivity(ctx, idAviso, oi, flags);

                          // "Marcar leído" se resuelve aquí mismo: quita el aviso y
                          // manda el visto. Antes tocarlo abría la app, que es justo
                          // lo que no se quiere de un botón que dice "ya lo he visto".
                          Intent li = new Intent(ctx, LeidoReceiver.class);
                          li.putExtra("ids", id);
                          li.putExtra("hasta", masNuevo);
                          li.putExtra("aviso", idAviso);
                          PendingIntent leidoPI =
                              PendingIntent.getBroadcast(ctx, idAviso + 100000, li, flags);

                          Intent ri = new Intent(ctx, ResponderReceiver.class);
                          ri.putExtra("id", id);
                          ri.putExtra("aviso", idAviso);
                          NotificationCompat.Action responder = new NotificationCompat.Action.Builder(
                                  0, "Responder",
                                  PendingIntent.getBroadcast(ctx, idAviso + 200000, ri, flagsAbiertos))
                              .addRemoteInput(new androidx.core.app.RemoteInput.Builder("texto")
                                  .setLabel("Escribe tu respuesta\u2026").build())
                              .setAllowGeneratedReplies(false)
                              .build();

                          nm.notify(idAviso, new NotificationCompat.Builder(ctx, canalChat(ctx))
                              .setSmallIcon(R.drawable.ic_stat_chat)
                              .setContentTitle(quien)
                              .setContentText(cuerpo)
                              .setStyle(new NotificationCompat.BigTextStyle().bigText(cuerpo))
                              .setPriority(NotificationCompat.PRIORITY_HIGH)
                              .setContentIntent(pi)
                              .addAction(0, "Marcar leído", leidoPI)
                              .addAction(responder)
                              .setAutoCancel(true)
                              .build());
                      }
                  }
              }

              // Contestar desde el aviso de la barra, sin abrir la app: lo que se
              // escribe ahí llega al hilo igual que si se hubiera escrito dentro.
              public static class ResponderReceiver extends BroadcastReceiver {
                  @Override
                  public void onReceive(Context ctx, Intent intent) {
                      final Context app = ctx.getApplicationContext();
                      android.os.Bundle escrito = androidx.core.app.RemoteInput.getResultsFromIntent(intent);
                      CharSequence cs = escrito == null ? null : escrito.getCharSequence("texto");
                      final String texto = cs == null ? "" : cs.toString().trim();
                      final String id = intent == null ? "" : intent.getStringExtra("id");
                      NotificationManager nm =
                          (NotificationManager) app.getSystemService(Context.NOTIFICATION_SERVICE);
                      if (nm != null) nm.cancel(intent == null ? 1002 : intent.getIntExtra("aviso", 1002));
                      if (texto.isEmpty() || id == null || id.isEmpty()) return;
                      final PendingResult pendiente = goAsync();
                      new Thread(() -> {
                          try { mandarRespuesta(app, id, texto); } catch (Exception ignored) {}
                          finally { pendiente.finish(); }
                      }).start();
                  }
              
                  private void mandarRespuesta(Context ctx, String id, String texto) throws Exception {
                      SharedPreferences prefs = ctx.getSharedPreferences(PREFS, Context.MODE_PRIVATE);
                      String url    = prefs.getString("chatUrl", "");
                      String email  = prefs.getString("chatEmail", "");
                      String nombre = prefs.getString("chatNombre", "");
                      if (url.isEmpty() || email.isEmpty()) return;
                      String token = obtenerTokenValido(ctx);
                      java.net.HttpURLConnection c =
                          (java.net.HttpURLConnection) new java.net.URL(url).openConnection();
                      c.setRequestMethod("POST");
                      c.setRequestProperty("Content-Type", "application/json");
                      c.setRequestProperty("X-User-Email", email);
                      if (token != null && !token.isEmpty())
                          c.setRequestProperty("Authorization", "Bearer " + token);
                      c.setConnectTimeout(15000);
                      c.setReadTimeout(15000);
                      c.setDoOutput(true);
                      org.json.JSONObject body = new org.json.JSONObject();
                      body.put("id", id);
                      body.put("texto", texto);
                      // El servidor coge el que le toque según de quién sea el hilo
                      body.put("nombre", nombre);
                      body.put("deNombre", nombre);
                      body.put("gestor", nombre);
                      c.getOutputStream().write(body.toString().getBytes("UTF-8"));
                      c.getResponseCode();
                      c.disconnect();
                  }
              }
              
              // Dar por leído desde el aviso, sin abrir nada. Quita el aviso al
              // momento y por detrás le dice al otro que ya está visto, que es
              // lo que esperaba ver de vuelta.
              public static class LeidoReceiver extends BroadcastReceiver {
                  @Override
                  public void onReceive(Context ctx, Intent intent) {
                      final Context app = ctx.getApplicationContext();
                      final String ids   = intent == null ? "" : intent.getStringExtra("ids");
                      final String hasta = intent == null ? "" : intent.getStringExtra("hasta");
                      NotificationManager nm =
                          (NotificationManager) app.getSystemService(Context.NOTIFICATION_SERVICE);
                      if (nm != null) nm.cancel(intent == null ? 1002 : intent.getIntExtra("aviso", 1002));
                      if (hasta != null && !hasta.isEmpty()) {
                          app.getSharedPreferences(PREFS, Context.MODE_PRIVATE)
                             .edit().putString("chatVisto", hasta).apply();
                      }
                      // goAsync da unos segundos para terminar la petición: sin
                      // esto Android puede matar el proceso en cuanto vuelve de
                      // onReceive y el visto no llegaría a salir.
                      final PendingResult pendiente = goAsync();
                      new Thread(() -> {
                          try { mandarVisto(app, ids); } catch (Exception ignored) {}
                          finally { pendiente.finish(); }
                      }).start();
                  }

                  private void mandarVisto(Context ctx, String ids) throws Exception {
                      if (ids == null || ids.isEmpty()) return;
                      SharedPreferences prefs = ctx.getSharedPreferences(PREFS, Context.MODE_PRIVATE);
                      String url    = prefs.getString("chatUrl", "");
                      String email  = prefs.getString("chatEmail", "");
                      String nombre = prefs.getString("chatNombre", "");
                      if (url.isEmpty() || email.isEmpty()) return;
                      String token = obtenerTokenValido(ctx);
                      for (String id : ids.split(",")) {
                          if (id.isEmpty()) continue;
                          java.net.HttpURLConnection c =
                              (java.net.HttpURLConnection) new java.net.URL(url).openConnection();
                          // POST con la cabecera que dice lo que de verdad es:
                          // HttpURLConnection no sabe mandar un PATCH.
                          c.setRequestMethod("POST");
                          c.setRequestProperty("X-Metodo", "PATCH");
                          c.setRequestProperty("Content-Type", "application/json");
                          c.setRequestProperty("X-User-Email", email);
                          if (token != null && !token.isEmpty())
                              c.setRequestProperty("Authorization", "Bearer " + token);
                          c.setConnectTimeout(15000);
                          c.setReadTimeout(15000);
                          c.setDoOutput(true);
                          org.json.JSONObject body = new org.json.JSONObject();
                          body.put("id", id);
                          body.put("visto", true);
                          body.put("nombre", nombre);
                          c.getOutputStream().write(body.toString().getBytes("UTF-8"));
                          c.getResponseCode();
                          c.disconnect();
                      }
                  }
              }

              public static class BootReceiver extends BroadcastReceiver {
                  @Override
                  public void onReceive(Context ctx, Intent intent) {
                      if (intent == null || !Intent.ACTION_BOOT_COMPLETED.equals(intent.getAction())) return;
                      // Al reiniciar el móvil, Android borra las alarmas. La de
                      // mirar si hay mensajes se reprogramaba sola cada vez que
                      // saltaba, así que al perderse no volvía nunca: hasta que
                      // alguien abría la app no llegaba un solo aviso.
                      try { programarAvisoChat(ctx); } catch (Exception ignored) {}
                      try { asegurarAvisoDeFondo(ctx); } catch (Exception ignored) {}
                      try { arrancarVigilante(ctx); } catch (Exception ignored) {}
                      SharedPreferences prefs = ctx.getSharedPreferences(PREFS, Context.MODE_PRIVATE);
                      String locJson = prefs.getString("geofenceLocations", null);
                      String gpsMode = prefs.getString("gpsMode", "always");
                      if (locJson == null || "off".equals(gpsMode)) return;
                      try {
                          org.json.JSONArray arr = new org.json.JSONArray(locJson);
                          if (arr.length() == 0) return;
                          GeofencingClient client = LocationServices.getGeofencingClient(ctx);
                          Intent gi = new Intent(ctx, GeofenceReceiver.class);
                          int piFlags = PendingIntent.FLAG_UPDATE_CURRENT
                              | (Build.VERSION.SDK_INT >= Build.VERSION_CODES.M ? PendingIntent.FLAG_MUTABLE : 0);
                          PendingIntent gpi = PendingIntent.getBroadcast(ctx, 9999, gi, piFlags);
                          List<Geofence> fences = new ArrayList<>();
                          for (int i = 0; i < arr.length(); i++) {
                              org.json.JSONObject loc = arr.getJSONObject(i);
                              fences.add(new Geofence.Builder()
                                  .setRequestId("work_" + i)
                                  .setCircularRegion(loc.getDouble("lat"), loc.getDouble("lng"), 300)
                                  .setExpirationDuration(Geofence.NEVER_EXPIRE)
                                  .setTransitionTypes(Geofence.GEOFENCE_TRANSITION_ENTER | Geofence.GEOFENCE_TRANSITION_DWELL)
                                  .setLoiteringDelay(60000)
                                  .build());
                          }
                          GeofencingRequest request = new GeofencingRequest.Builder()
                              .setInitialTrigger(GeofencingRequest.INITIAL_TRIGGER_ENTER | GeofencingRequest.INITIAL_TRIGGER_DWELL)
                              .addGeofences(fences)
                              .build();
                          if (ActivityCompat.checkSelfPermission(ctx, android.Manifest.permission.ACCESS_FINE_LOCATION)
                                  == android.content.pm.PackageManager.PERMISSION_GRANTED) {
                              client.addGeofences(request, gpi);
                          }
                      } catch (Exception e) {}
                  }
              }

              // Registers hours directly from notification without opening the app
              public static class RegistrarReceiver extends BroadcastReceiver {
                  @Override
                  public void onReceive(Context ctx, Intent intent) {
                      final PendingResult pr = goAsync();
                      // El aviso se quita en cuanto se pulsa: antes solo se
                      // quitaba si todo iba bien, y con cualquier tropiezo se
                      // quedaba en la barra aunque la jornada ya estuviera. Lo
                      // que pase lo dice el mensaje de abajo.
                      try {
                          NotificationManager nm0 = (NotificationManager) ctx.getSystemService(Context.NOTIFICATION_SERVICE);
                          nm0.cancel(1001);
                          nm0.cancel(1003);
                      } catch (Exception ignored) {}
                      SharedPreferences prefs = ctx.getSharedPreferences(PREFS, Context.MODE_PRIVATE);
                      final String fileId = prefs.getString("driveFileId", null);
                      final String inicio = prefs.getString("lastHoraInicio", null);
                      final String fin    = prefs.getString("lastHoraFin", null);
                      final Context app   = ctx.getApplicationContext();
                      if (inicio == null || fin == null || fileId == null || fileId.isEmpty()) {
                          new Handler(Looper.getMainLooper()).post(() ->
                              Toast.makeText(app, "⚠️ Abre la app para registrar", Toast.LENGTH_LONG).show());
                          pr.finish(); return;
                      }
                      new Thread(() -> {
                          try {
                              // The stored access token lasts an hour, so by the time the
                              // geofence fires it is usually dead — renew it first.
                              final String token = obtenerTokenValido(app);
                              if (token == null) {
                                  new Handler(Looper.getMainLooper()).post(() ->
                                      Toast.makeText(app, "⚠️ Abre la app para renovar la sesión", Toast.LENGTH_LONG).show());
                                  pr.finish(); return;
                              }
                              String[] p1 = inicio.split(":"), p2 = fin.split(":");
                              int min = (Integer.parseInt(p2[0])*60 + Integer.parseInt(p2[1]))
                                      - (Integer.parseInt(p1[0])*60 + Integer.parseInt(p1[1]));
                              if (min <= 0) min += 1440;
                              final double horas = Math.round(min / 6.0) / 10.0;
                              String fecha   = new java.text.SimpleDateFormat("yyyy-MM-dd", java.util.Locale.US).format(new java.util.Date());
                              String regId   = fecha.replace("-", "");
                              String fechaES = new java.text.SimpleDateFormat("dd/MM/yyyy",  java.util.Locale.US).format(new java.util.Date());
                              // GET existing Drive file
                              java.net.URL getUrl = new java.net.URL("https://www.googleapis.com/drive/v3/files/" + fileId + "?alt=media");
                              java.net.HttpURLConnection gc = (java.net.HttpURLConnection) getUrl.openConnection();
                              gc.setRequestProperty("Authorization", "Bearer " + token);
                              final int getCode = gc.getResponseCode();
                              // Never fall through to the PATCH on a failed read: doing so
                              // would upload an empty object and wipe the whole history.
                              if (getCode != 200) {
                                  gc.disconnect();
                                  new Handler(Looper.getMainLooper()).post(() ->
                                      Toast.makeText(app, "❌ No se pudo leer los datos (" + getCode + ")", Toast.LENGTH_LONG).show());
                                  pr.finish(); return;
                              }
                              java.io.BufferedReader br = new java.io.BufferedReader(
                                  new java.io.InputStreamReader(gc.getInputStream(), "UTF-8"));
                              StringBuilder sb = new StringBuilder(); String line;
                              while ((line = br.readLine()) != null) sb.append(line);
                              org.json.JSONObject data = new org.json.JSONObject(sb.toString());
                              gc.disconnect();
                              if (!data.has("historial")) data.put("historial", new org.json.JSONObject());
                              if (!data.has("horasTrabajadas")) data.put("horasTrabajadas", 0.0);
                              org.json.JSONObject hist = data.getJSONObject("historial");
                              // Several shifts a day are allowed: ids are YYYYMMDD, -2, -3…
                              if (hist.has(regId)) {
                                  int n = 2;
                                  while (hist.has(regId + "-" + n)) n++;
                                  regId = regId + "-" + n;
                              }
                              // Calculate nocturnal hours (22:00–06:00 range)
                              int startMin = Integer.parseInt(p1[0]) * 60 + Integer.parseInt(p1[1]);
                              int endMin   = Integer.parseInt(p2[0]) * 60 + Integer.parseInt(p2[1]);
                              if (endMin <= startMin) endMin += 1440;
                              int noctStart = 22 * 60, noctEnd = 6 * 60 + 1440;
                              int overlapStart = Math.max(startMin, noctStart);
                              int overlapEnd   = Math.min(endMin, noctEnd);
                              double horasNoct = (overlapEnd > overlapStart)
                                  ? Math.round((overlapEnd - overlapStart) / 6.0) / 10.0 : 0.0;
                              boolean esNoche  = horasNoct > 0;
                              double total = Math.round((data.getDouble("horasTrabajadas") + horas) * 10) / 10.0;
                              data.put("horasTrabajadas", total);
                              org.json.JSONObject reg = new org.json.JSONObject();
                              reg.put("fecha", fechaES); reg.put("horas", horas);
                              reg.put("timestamp", System.currentTimeMillis());
                              reg.put("horaInicio", inicio); reg.put("horaFin", fin);
                              if (esNoche) { reg.put("esNoche", true); reg.put("horasNocturnas", horasNoct); }
                              hist.put(regId, reg);
                              // PATCH Drive file
                              byte[] body = data.toString().getBytes("UTF-8");
                              java.net.URL pUrl = new java.net.URL(
                                  "https://www.googleapis.com/upload/drive/v3/files/" + fileId + "?uploadType=media");
                              java.net.HttpURLConnection pc = (java.net.HttpURLConnection) pUrl.openConnection();
                              pc.setRequestMethod("PATCH");
                              pc.setRequestProperty("Authorization", "Bearer " + token);
                              pc.setRequestProperty("Content-Type", "application/json; charset=UTF-8");
                              pc.setDoOutput(true);
                              pc.getOutputStream().write(body);
                              final int code = pc.getResponseCode();
                              pc.disconnect();
                              ((NotificationManager) app.getSystemService(Context.NOTIFICATION_SERVICE)).cancel(1001);
                              if (code == 200 || code == 201) {
                                  app.getSharedPreferences(PREFS, Context.MODE_PRIVATE).edit()
                                      .putString("lastRegisteredDate", regId.length() > 8 ? regId.substring(0, 8) : regId)
                                      .putString("pendingRefresh", "1")
                                      .apply();
                                  // Con la jornada registrada, fuera también el turno de la barra
                                  arrancarVigilante(app);
                              }
                              new Handler(Looper.getMainLooper()).post(() ->
                                  Toast.makeText(app,
                                      (code == 200 || code == 201)
                                          ? "✅ " + horas + "h registradas (" + inicio + "–" + fin + ")"
                                          : "❌ Error al registrar (" + code + ")",
                                      Toast.LENGTH_LONG).show());
                          } catch (Exception e) {
                              new Handler(Looper.getMainLooper()).post(() ->
                                  Toast.makeText(app, "❌ " + e.getMessage(), Toast.LENGTH_LONG).show());
                          } finally { pr.finish(); }
                      }).start();
                  }
              }
          }
          JAVAEOF

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Add play-services-location for native geofencing
        run: |
          GRADLE="android/app/build.gradle"
          sed -i "/dependencies {/a\\    implementation 'com.google.android.gms:play-services-location:21.0.1'" "$GRADLE"
          # Avisos al instante: Firebase Cloud Messaging. La configuración
          # (google-services.json) lleva las tres apps; la plantilla de Capacitor
          # aplica sola el plugin de Google en cuanto el fichero está.
          sed -i "/dependencies {/a\\    implementation 'com.google.firebase:firebase-messaging:23.1.2'" "$GRADLE"
          cp .github/google-services.json android/app/google-services.json

      - name: Set native splash background color
        run: |
          COLORS="android/app/src/main/res/values/colors.xml"
          STYLES="android/app/src/main/res/values/styles.xml"
          # Add colorPrimary to colors.xml
          if [ -f "$COLORS" ]; then
            grep -q 'colorPrimary' "$COLORS" || \
              sed -i 's|</resources>|    <color name="colorPrimary">#1565C0</color>\n</resources>|' "$COLORS"
          else
            mkdir -p "$(dirname "$COLORS")"
            printf '<?xml version="1.0" encoding="utf-8"?>\n<resources>\n    <color name="colorPrimary">#1565C0</color>\n</resources>\n' > "$COLORS"
          fi
          # Add windowBackground to the NoActionBar theme so launch shows blue instead of white/black
          if [ -f "$STYLES" ]; then
            grep -q 'windowBackground' "$STYLES" || \
              sed -i 's|<style name="AppTheme.NoActionBar">|<style name="AppTheme.NoActionBar">\n        <item name="android:windowBackground">@color/colorPrimary</item>|' "$STYLES"
          fi

      - name: Restore signing keystore
        run: |
          mkdir -p ~/.android
          base64 -d .github/debug.keystore.b64 > ~/.android/debug.keystore

      - name: Generate notification sound files
        run: |
          python3 << 'PYEOF'
          import wave, struct, math, os
          def gen_wav(path, segments, sr=44100):
              frames = []
              for seg in segments:
                  freq = seg[0]; dur = seg[1]
                  mode = seg[2] if len(seg) > 2 else 'tone'
                  freq_end = seg[3] if len(seg) > 3 else freq
                  n = int(sr * dur); phase = 0.0
                  for i in range(n):
                      t = i / sr
                      if freq == 0:
                          frames.append(struct.pack('<h', 0)); continue
                      att = min(1.0, t / 0.012)
                      if mode == 'bell':
                          env = att * math.exp(-t * 4.0 / dur)
                          f = freq
                      elif mode == 'sweep':
                          env = att * min(1.0, (dur - t) / 0.10)
                          f = freq + (freq_end - freq) * t / dur
                      else:
                          env = att * min(1.0, (dur - t) / max(dur * 0.15, 0.05))
                          f = freq
                      phase += 2 * math.pi * f / sr
                      frames.append(struct.pack('<h', int(32767 * 0.65 * env * math.sin(phase))))
              with wave.open(path, 'w') as f:
                  f.setnchannels(1); f.setsampwidth(2); f.setframerate(sr)
                  f.writeframes(b''.join(frames))
          os.makedirs('android/app/src/main/res/raw', exist_ok=True)
          R = 'android/app/src/main/res/raw/'
          gen_wav(R+'notif_ding.wav',    [(880, 1.0, 'bell')])
          gen_wav(R+'notif_campana.wav', [(660, 0.5, 'bell'), (880, 0.75, 'bell')])
          gen_wav(R+'notif_alerta.wav',  [(440, 0.20), (0, 0.05), (660, 0.20), (0, 0.05), (880, 0.30)])
          gen_wav(R+'notif_silbido.wav', [(800, 0.42, 'sweep', 1400), (1400, 0.38, 'sweep', 800)])
          gen_wav(R+'notif_doble.wav',   [(880, 0.30), (0, 0.12), (880, 0.30)])
          gen_wav(R+'notif_fanfare.wav', [(440, 0.20), (550, 0.20), (660, 0.20), (880, 0.60, 'bell')])
          gen_wav(R+'notif_suave.wav',   [(330, 1.2, 'bell')])
          # Los de más, para elegir
          gen_wav(R+'notif_xilofono.wav', [(523, 0.16, 'bell'), (659, 0.16, 'bell'), (784, 0.16, 'bell'), (1047, 0.5, 'bell')])
          gen_wav(R+'notif_dingdong.wav', [(784, 0.55, 'bell'), (622, 0.9, 'bell')])
          gen_wav(R+'notif_burbuja.wav', [(400, 0.12, 'sweep', 900), (0, 0.06), (500, 0.14, 'sweep', 1150)])
          gen_wav(R+'notif_claxon.wav', [(392, 0.22), (0, 0.08), (392, 0.45)])
          gen_wav(R+'notif_arpa.wav', [(1047, 0.14, 'bell'), (880, 0.14, 'bell'), (784, 0.14, 'bell'), (659, 0.14, 'bell'), (523, 0.6, 'bell')])
          gen_wav(R+'notif_triple.wav', [(1200, 0.1), (0, 0.08), (1200, 0.1), (0, 0.08), (1200, 0.1)])
          gen_wav(R+'notif_sirena.wav', [(600, 0.35, 'sweep', 1000), (1000, 0.35, 'sweep', 600), (600, 0.35, 'sweep', 1000), (1000, 0.35, 'sweep', 600)])
          gen_wav(R+'notif_gota.wav', [(1500, 0.12, 'sweep', 500), (0, 0.05), (1200, 0.35, 'bell')])
          gen_wav(R+'notif_marimba.wav', [(523, 0.22, 'bell'), (784, 0.22, 'bell'), (659, 0.5, 'bell')])
          gen_wav(R+'notif_cristal.wav', [(2093, 0.9, 'bell')])
          gen_wav(R+'notif_moneda.wav', [(988, 0.08), (1319, 0.45, 'bell')])
          gen_wav(R+'notif_pajaro.wav', [(2000, 0.08, 'sweep', 2600), (0, 0.05), (2200, 0.08, 'sweep', 2800), (0, 0.05), (2400, 0.12, 'sweep', 3000)])
          print("Sound files OK")
          PYEOF

      - name: Set Android launcher icon
        run: |
          pip install Pillow -q
          ICONO='www/icons/icon-512.png' ICONO_FG='www/icons/icon-fg-512.png' ICON_BG='21,101,192' python3 << 'PYEOF'
          from PIL import Image
          import os

          # El icono del móvil es exactamente el mismo fichero que usa la web:
          # uno solo para las dos formas de instalarla. Antes se dibujaba aquí
          # con la fuente de emojis y salía parecido, pero no igual.
          BG   = tuple(int(x) for x in os.environ['ICON_BG'].split(',')[:3])
          full = Image.open(os.environ['ICONO']).convert('RGB')
          fg   = Image.open(os.environ['ICONO_FG']).convert('RGBA')
          res_base = 'android/app/src/main/res'

          sizes = {
              'mipmap-mdpi':    (48,  108),
              'mipmap-hdpi':    (72,  162),
              'mipmap-xhdpi':   (96,  216),
              'mipmap-xxhdpi':  (144, 324),
              'mipmap-xxxhdpi': (192, 432),
          }

          for dir_name, (size, asize) in sizes.items():
              path = f'{res_base}/{dir_name}'
              os.makedirs(path, exist_ok=True)

              cuadro = full.resize((size, size), Image.LANCZOS)
              cuadro.save(f'{path}/ic_launcher.png')
              cuadro.save(f'{path}/ic_launcher_round.png')

              # Adaptativo: el sistema recorta a dos tercios del lienzo, así que
              # el dibujo va justo a ese tamaño y centrado. El fondo, del color
              # de la aplicación, es lo único que asoma por las esquinas.
              d = asize * 2 // 3
              adapt = Image.new('RGBA', (asize, asize), (*BG, 255))
              chico = fg.resize((d, d), Image.LANCZOS)
              off = (asize - d) // 2
              adapt.paste(chico, (off, off), chico)
              adapt.convert('RGB').save(f'{path}/ic_launcher_foreground.png')

              Image.new('RGB', (asize, asize), BG).save(f'{path}/ic_launcher_background.png')

          print("Icons generated OK")
          PYEOF

          RES="android/app/src/main/res"
          mkdir -p "$RES/mipmap-anydpi-v26"
          cat > "$RES/mipmap-anydpi-v26/ic_launcher.xml" << 'ICONEOF'
          <?xml version="1.0" encoding="utf-8"?>
          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
              <background android:drawable="@mipmap/ic_launcher_background"/>
              <foreground android:drawable="@mipmap/ic_launcher_foreground"/>
          </adaptive-icon>
          ICONEOF
          cp "$RES/mipmap-anydpi-v26/ic_launcher.xml" "$RES/mipmap-anydpi-v26/ic_launcher_round.xml"

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: ''

      - name: Build debug APK
        working-directory: android
        run: |
          # Los repositorios de Maven fallan de vez en cuando y tiran el build
          # entero sin que haya nada mal en el código. Reintentar lo absorbe.
          for intento in 1 2 3; do
            if ./gradlew assembleDebug --no-daemon; then exit 0; fi
            echo "::warning::Build fallido (intento $intento). Reintentando en 20s…"
            sleep 20
          done
          echo "::error::El build ha fallado tres veces"
          exit 1

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: horas-emt-${{ github.run_number }}
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

      - name: Renombrar el APK con su versión
        run: cp android/app/build/outputs/apk/debug/app-debug.apk emt-movilidad-${{ env.APP_VER }}.apk

      - name: Create GitHub Release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: "EMT - Movilidad — Build ${{ github.run_number }}"
          body: "APK generado automáticamente en build #${{ github.run_number }}."
          files: emt-movilidad-${{ env.APP_VER }}.apk
          fail_on_unmatched_files: true
